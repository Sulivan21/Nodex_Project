<title>Nodex Marcos de Acero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>/* Layout: header de navegación · configurador en tres columnas (pasos · formulario · dibujo fijo) */
:root {
  --bg: #ffffff;
  --surface: #f3f4f6;
  --surface-2: #e9ebef;
  --line: #dcdfe4;
  --ink: #14161a;
  --ink-2: #3a3f47;
  --muted: #646b76;
  --accent: #d2141e;
  --accent-ink: #ffffff;
  --accent-soft: #fcebec;
  --steel: #7b8794;
  --steel-2: #a9b2bc;
  --ok: #18794e;
  --ok-soft: #e3f4ea;
  --warn: #a35c00;
  --warn-soft: #fbefd9;
  --bad: #b42318;
  --bad-soft: #fde8e6;
  --info: #2d5b9a;
  --info-soft: #e6eefa;
  --shadow: 0 1px 2px rgba(20, 22, 26, .06), 0 8px 24px rgba(20, 22, 26, .06);
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101215; --surface: #181b20; --surface-2: #20242a; --line: #2c3139; --ink: #eceef1; --ink-2: #c9ced6; --muted: #98a0ab;
    --accent: #f0444c; --accent-ink: #ffffff; --accent-soft: #3a1a1c; --steel: #8e99a6; --steel-2: #5e6772;
    --ok: #4cc38a; --ok-soft: #12301f; --warn: #e3a24a; --warn-soft: #34260f; --bad: #ff7a6e; --bad-soft: #3a1714; --info: #8db4ec; --info-soft: #172438;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101215; --surface: #181b20; --surface-2: #20242a; --line: #2c3139; --ink: #eceef1; --ink-2: #c9ced6; --muted: #98a0ab;
  --accent: #f0444c; --accent-ink: #ffffff; --accent-soft: #3a1a1c; --steel: #8e99a6; --steel-2: #5e6772;
  --ok: #4cc38a; --ok-soft: #12301f; --warn: #e3a24a; --warn-soft: #34260f; --bad: #ff7a6e; --bad-soft: #3a1714; --info: #8db4ec; --info-soft: #172438;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 800; line-height: 1.15; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.eyebrow { font-family: var(--font-body); font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ---------- header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { display: flex; align-items: center; gap: 20px; min-height: 60px; max-width: 1600px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.brand svg { width: 34px; height: 26px; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: .02em; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav button { background: none; border: 0; padding: 18px 12px 16px; cursor: pointer; color: var(--ink-2); font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; }
.nav button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.proj { display: flex; align-items: center; gap: 10px; flex: none; }
.proj .name { font-weight: 600; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saved { font-size: 12px; color: var(--muted); }

/* ---------- layout ---------- */
.wrap { max-width: 1600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.cfg { display: grid; grid-template-columns: 210px minmax(0, 1fr) minmax(0, 0.95fr); gap: 24px; align-items: start; }
.steps { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); display: flex; flex-direction: column; gap: 2px; }
.step { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; padding: 8px 8px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: var(--r); color: var(--ink-2); }
.step .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-weight: 700; font-family: var(--font-display); font-size: 13px; color: var(--muted); }
.step[aria-current="step"] { color: var(--ink); font-weight: 600; background: var(--surface); }
.step[aria-current="step"] .dot { background: var(--accent); color: var(--accent-ink); }
.step.done .dot { background: var(--ink); color: var(--bg); }
.step small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
.content { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.visual { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.head { display: flex; flex-direction: column; gap: 6px; }
.head p { color: var(--muted); font-size: 15px; }

/* ---------- panels and form ---------- */
.panel { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel > header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.panel.soft { background: var(--surface); border-color: transparent; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field > .lab { font-weight: 600; font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: baseline; }
.field .hint { font-size: 12px; color: var(--muted); line-height: 1.4; }
.inp { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); overflow: hidden; min-width: 0; }
.inp:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp input, .inp select { border: 0; background: transparent; padding: 8px 10px; min-width: 0; width: 100%; outline: none; font-family: var(--font-mono); font-size: 14px; }
.inp select { font-family: var(--font-body); }
.inp .u { display: grid; place-items: center; padding: 0 10px; color: var(--muted); background: var(--surface); border-left: 1px solid var(--line); font-size: 12.5px; white-space: nowrap; }
.inp.ro { background: var(--surface); }
.inp.ro input { color: var(--ink-2); }
select.plain, input.plain { border: 1px solid var(--line); border-radius: 7px; background: var(--bg); padding: 7px 9px; min-width: 0; }
textarea { border: 1px solid var(--line); border-radius: 7px; background: var(--bg); padding: 8px 10px; width: 100%; font-family: var(--font-mono); font-size: 12px; }
.check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.check input { accent-color: var(--accent); margin-top: 3px; }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.choice { border: 1px solid var(--line); border-radius: 9px; padding: 10px; background: var(--bg); cursor: pointer; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; font-weight: 600; color: var(--ink-2); }
.choice svg { width: 100%; max-width: 110px; height: 44px; }
.choice small { font-weight: 400; color: var(--muted); font-size: 11.5px; line-height: 1.3; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; color: var(--ink-2); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-decoration: none; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.outline { border-color: var(--accent); color: var(--accent); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.nav-foot { display: flex; justify-content: space-between; gap: 12px; padding-top: 6px; border-top: 1px solid var(--line); flex-wrap: wrap; }

/* ---------- derived values ---------- */
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kv > div { background: var(--surface); border-radius: 8px; padding: 9px 11px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kv span { font-size: 11.5px; color: var(--muted); }
.kv b { font-family: var(--font-mono); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kv em { font-style: normal; font-size: 11px; color: var(--muted); }

.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--info-soft); color: var(--ink-2); font-size: 13px; line-height: 1.45; }
.note::before { content: "i"; flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--info); color: var(--info); font: 700 11px/15px var(--font-mono); text-align: center; margin-top: 1px; }
.note.warn { background: var(--warn-soft); }
.note.warn::before { content: "!"; border-color: var(--warn); color: var(--warn); }
.note.bad { background: var(--bad-soft); }
.note.bad::before { content: "!"; border-color: var(--bad); color: var(--bad); }
.flag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); font-weight: 600; white-space: nowrap; }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 9px; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
th { background: var(--surface); font-weight: 600; font-size: 12px; color: var(--ink-2); position: sticky; top: 0; z-index: 1; }
td.wrap, th.wrap { white-space: normal; min-width: 160px; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
tbody tr.sel { background: var(--accent-soft); }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--surface); }
th.sort { cursor: pointer; }
th.sort::after { content: " ↕"; color: var(--muted); font-weight: 400; }
td input.cell, td select.cell { width: 74px; border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; background: var(--bg); font-family: var(--font-mono); font-size: 12.5px; }
td input.cell.wide { width: 170px; font-family: var(--font-body); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.cumple { background: var(--ok-soft); color: var(--ok); }
.pill.falla { background: var(--bad-soft); color: var(--bad); }
.pill.alcance { background: var(--surface-2); color: var(--muted); }
.pill.insuficiente, .pill.pendiente { background: var(--warn-soft); color: var(--warn); }
.pill.inestable { background: var(--bad-soft); color: var(--bad); }

.bar { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); min-width: 70px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--ok); }
.bar.warn i { background: var(--warn); }
.bar.bad i { background: var(--bad); }
.eta { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; min-width: 120px; }
.eta b { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; }

.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.stat { border-radius: 9px; padding: 10px 12px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 22px; font-weight: 800; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.ok b { color: var(--ok); } .stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); }

.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .15s; }

/* ---------- visual panel ---------- */
.viewer { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
.viewer .bar-top { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
.vbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 11px; cursor: pointer; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
.vbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.vbtn.icon { padding: 6px 8px; margin-left: auto; }
.canvas { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: var(--bg); touch-action: none; }
.canvas svg, .canvas canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
.hint-3d { position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; color: var(--muted); pointer-events: none; }

.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10, 12, 15, .55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.overlay .box { background: var(--bg); border-radius: 14px; width: min(1400px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); }
.overlay .box .canvas { aspect-ratio: auto; height: min(78vh, 900px); }
.overlay .box header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); gap: 12px; flex-wrap: wrap; }
.modal .box { width: min(760px, 100%); }
.modal .body { padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }

/* drawing strokes (SVG) */
.d-member { stroke: var(--steel); fill: none; stroke-linecap: square; }
.d-member-fill { fill: var(--surface-2); stroke: var(--steel); stroke-width: 1; }
.d-dim { stroke: var(--ink-2); stroke-width: 1; fill: none; }
.d-dimtxt { fill: var(--ink); font: 600 12px var(--font-body); }
.d-txt { fill: var(--ink-2); font: 500 11px var(--font-body); }
.d-txt.mono { font-family: var(--font-mono); }
.d-purlin { fill: var(--ink-2); }
.d-support { fill: none; stroke: var(--ink-2); stroke-width: 1.4; }
.d-hatch { stroke: var(--steel-2); stroke-width: 1; }
.d-load { stroke: var(--accent); fill: var(--accent); }
.d-loadtxt { fill: var(--accent); font: 600 11px var(--font-mono); }
.d-diag { fill: color-mix(in srgb, var(--info) 18%, transparent); stroke: var(--info); stroke-width: 1.5; }
.d-diag.neg { fill: color-mix(in srgb, var(--accent) 16%, transparent); stroke: var(--accent); }
.d-defl { stroke: var(--accent); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
.d-grid { stroke: var(--line); stroke-width: 1; }
.d-node { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1.2; }
.d-react { stroke: var(--ok); fill: var(--ok); }
.d-reacttxt { fill: var(--ok); font: 600 11px var(--font-mono); }

/* ---------- catalog and docs ---------- */
.two { display: grid; grid-template-columns: 220px minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); }
.side button { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; cursor: pointer; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
.side button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side button span { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip.off { opacity: .75; }
.doc { max-width: 900px; display: flex; flex-direction: column; gap: 18px; }
.doc p, .doc li { max-width: 72ch; color: var(--ink-2); }
.doc ol, .doc ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.eq { font-family: var(--font-mono); font-size: 13px; background: var(--surface); padding: 2px 6px; border-radius: 4px; }
.memo { display: flex; flex-direction: column; gap: 16px; max-width: 980px; }
.memo section { display: flex; flex-direction: column; gap: 8px; }
.memo h2 { border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
details.panel > summary { cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 15px; list-style: none; display: flex; justify-content: space-between; }
details.panel > summary::after { content: "+"; color: var(--muted); font-family: var(--font-mono); }
details.panel[open] > summary::after { content: "–"; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); font-weight: 500; }

@media (max-width: 1280px) {
  .cfg { grid-template-columns: 190px minmax(0, 1fr); }
  .visual { grid-column: 2; grid-row: 1; position: static; }
  .content { grid-column: 2; }
  .steps { grid-row: 1 / span 2; }
  .two { grid-template-columns: 200px minmax(0, 1fr); }
  .two > .detail { grid-column: 2; }
}
@media (max-width: 820px) {
  .cfg { grid-template-columns: minmax(0, 1fr); }
  .steps { position: static; flex-direction: row; overflow-x: auto; grid-row: auto; gap: 6px; scrollbar-width: thin; }
  .step { grid-template-columns: 26px auto; white-space: nowrap; }
  .step small { display: none; }
  .visual, .content { grid-column: 1; }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .two { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; flex-direction: row; overflow-x: auto; }
  .two > .detail { grid-column: 1; }
  .proj .name { max-width: 120px; }
  h1 { font-size: 24px; }
  .canvas { aspect-ratio: 1 / 1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    [a, 0, 0, -a, 0, 0],
    [0, b, c, 0, -b, c],
    [0, c, d, 0, -c, e],
    [-a, 0, 0, a, 0, 0],
    [0, -b, -c, 0, b, -c],
    [0, c, e, 0, -c, d],
  ];
};

// ---------- matriz geométrica consistente (N > 0 tensión) ----------
NX.kGeom = function (N, L) {
  const f = N / (30 * L), L2 = L * L;
  // incluye término axial de cuerda en u para mantener la forma estándar 6x6
  return [
    [0, 0, 0, 0, 0, 0],
    [0, 36 * f, 3 * L * f, 0, -36 * f, 3 * L * f],
    [0, 3 * L * f, 4 * L2 * f, 0, -3 * L * f, -L2 * f],
    [0, 0, 0, 0, 0, 0],
    [0, -36 * f, -3 * L * f, 0, 36 * f, -3 * L * f],
    [0, 3 * L * f, -L2 * f, 0, -3 * L * f, 4 * L2 * f],
  ];
};

// T = diag(R, R) (ec. 28); devuelve k_g = Tᵀ k_l T
NX.toGlobal = function (k, c, s) {
  // kt = k·T ; out = Tᵀ·kt, aprovechando la estructura por bloques de T
  const kt = new Array(6);
  for (let i = 0; i < 6; i++) {
    const r = k[i];
    kt[i] = [r[0] * c - r[1] * s, r[0] * s + r[1] * c, r[2], r[3] * c - r[4] * s, r[3] * s + r[4] * c, r[5]];
  }
  const out = new Array(6);
  for (let blk = 0; blk < 2; blk++) {
    const o = 3 * blk;
    const r0 = kt[o], r1 = kt[o + 1], r2 = kt[o + 2];
    out[o] = r0.map((v, j) => c * v - s * r1[j]);
    out[o + 1] = r0.map((v, j) => s * v + c * r1[j]);
    out[o + 2] = r2.slice();
  }
  return out;
};

NX.vecToLocal = function (v, c, s) {
  return [c * v[0] + s * v[1], -s * v[0] + c * v[1], v[2], c * v[3] + s * v[4], -s * v[3] + c * v[4], v[5]];
};
NX.vecToGlobal = function (v, c, s) {
  return [c * v[0] - s * v[1], s * v[0] + c * v[1], v[2], c * v[3] - s * v[4], s * v[3] + c * v[4], v[5]];
};

/* ---------- cargas de barra en ejes locales ----------
 * Cada carga de barra se convierte a una lista de "piezas" locales:
 *  {k:'dist', a, b, pa, pb, qa, qb}  p axial, q transversal (N/mm), a≤x≤b (mm)
 *  {k:'pt', x, Px, Py}               fuerza puntual local (N)
 *  {k:'mom', x, M}                   momento puntual (N·mm), antihorario +
 * Entrada (global o local):
 *  {type:'dist', dir:'gx'|'gy'|'lx'|'ly', a, b (fracción 0..1 ó mm con abs:true), qa, qb (N/mm), proj:'none'|'h'|'v'}
 *    proj 'h': intensidad por unidad de proyección horizontal; 'v': por proyección vertical
 *  {type:'point', dir, x, P}   {type:'moment', x, M}
 */
NX.localPieces = function (load, g) {
  const L = g.L;
  const pos = (v) => (load.abs ? v : v * L);
  const comp = (dir, val) => {
    // devuelve [axial, transversal] locales para una intensidad en dirección dir
    if (dir === 'lx') return [val, 0];
    if (dir === 'ly') return [0, val];
    const gx = dir === 'gx' ? val : 0, gy = dir === 'gy' ? val : 0;
    return [g.c * gx + g.s * gy, -g.s * gx + g.c * gy];
  };
  if (load.type === 'dist') {
    let a = pos(load.a ?? 0), b = pos(load.b ?? 1);
    if (a > b) [a, b] = [b, a];
    a = Math.max(0, Math.min(L, a)); b = Math.max(0, Math.min(L, b));
    let f = 1;
    if (load.proj === 'h') f = Math.abs(g.dx) / L; // por proyección horizontal → por longitud de barra
    if (load.proj === 'v') f = Math.abs(g.dy) / L;
    const [pa, qa] = comp(load.dir, (load.qa ?? 0) * f);
    const [pb, qb] = comp(load.dir, (load.qb ?? load.qa ?? 0) * f);
    if (b - a < 1e-9) return [];
    return [{ k: 'dist', a, b, pa, pb, qa, qb }];
  }
  if (load.type === 'point') {
    const x = Math.max(0, Math.min(L, pos(load.x)));
    const [Px, Py] = comp(load.dir, load.P);
    return [{ k: 'pt', x, Px, Py }];
  }
  if (load.type === 'moment') {
    return [{ k: 'mom', x: Math.max(0, Math.min(L, pos(load.x))), M: load.M }];
  }
  throw new Error('Tipo de carga desconocido: ' + load.type);
};

// vector de cargas nodales equivalentes local (ec. 32–35), cuadratura de Gauss de 3 puntos (exacta grado 5)
const GP = [[-Math.sqrt(3 / 5), 5 / 9], [0, 8 / 9], [Math.sqrt(3 / 5), 5 / 9]];
NX.equivLocal = function (pieces, L) {
  const f = [0, 0, 0, 0, 0, 0];
  for (const p of pieces) {
    if (p.k === 'dist') {
      const h = (p.b - p.a) / 2, m = (p.a + p.b) / 2;
      for (const [t, w] of GP) {
        const x = m + h * t, r = (x - p.a) / (p.b - p.a);
        const pp = p.pa + (p.pb - p.pa) * r, qq = p.qa + (p.qb - p.qa) * r;
        const N = NX.shape(x / L, L), ww = w * h;
        f[0] += N.Na1 * pp * ww; f[3] += N.Na2 * pp * ww;
        f[1] += N.N1 * qq * ww; f[2] += N.N2 * qq * ww; f[4] += N.N3 * qq * ww; f[5] += N.N4 * qq * ww;
      }
    } else if (p.k === 'pt') {
      const N = NX.shape(p.x / L, L);
      f[0] += N.Na1 * p.Px; f[3] += N.Na2 * p.Px;
      f[1] += N.N1 * p.Py; f[2] += N.N2 * p.Py; f[4] += N.N3 * p.Py; f[5] += N.N4 * p.Py;
    } else if (p.k === 'mom') {
      const N = NX.shape(p.x / L, L);
      f[1] += p.M * N.dN1; f[2] += p.M * N.dN2; f[4] += p.M * N.dN3; f[5] += p.M * N.dN4;
    }
  }
  return f;
};

/* ---------- solucionador en banda (eliminación gaussiana sin pivoteo) ----------
 * Para K simétrica definida positiva los pivotes son positivos; un pivote ≤ 0
 * indica mecanismo o pérdida de estabilidad (con matriz geométrica). */
NX.bandSolve = function (n, hb, getK, rhsList) {
  const w = 2 * hb + 1;
  let A;
  if (getK instanceof Float64Array) A = getK; // matriz en banda ya ensamblada (se modifica)
  else {
    A = new Float64Array(n * w);
    for (let i = 0; i < n; i++) for (let j = Math.max(0, i - hb); j <= Math.min(n - 1, i + hb); j++) A[i * w + (j - i + hb)] = getK(i, j);
  }
  const B = rhsList.map((r) => Float64Array.from(r));
  let minPivotRatio = Infinity, diagMax = 0;
  for (let i = 0; i < n; i++) diagMax = Math.max(diagMax, Math.abs(A[i * w + hb]));
  for (let k = 0; k < n; k++) {
    const rk = k * w - k + hb; // A[k][j] = A[rk + j]
    const piv = A[rk + k];
    minPivotRatio = Math.min(minPivotRatio, piv / (diagMax || 1));
    if (!(piv > 1e-12 * diagMax)) return { ok: false, reason: 'pivote', dof: k };
    const iMax = Math.min(n - 1, k + hb);
    for (let i = k + 1; i <= iMax; i++) {
      const ri = i * w - i + hb;
      const fct = A[ri + k] / piv;
      if (fct === 0) continue;
      for (let j = k; j <= iMax; j++) A[ri + j] -= fct * A[rk + j];
      for (const b of B) b[i] -= fct * b[k];
    }
  }
  for (const b of B) {
    for (let k = n - 1; k >= 0; k--) {
      const rk = k * w - k + hb;
      let sm = b[k];
      const jMax = Math.min(n - 1, k + hb);
      for (let j = k + 1; j <= jMax; j++) sm -= A[rk + j] * b[j];
      b[k] = sm / A[rk + k];
    }
  }
  return { ok: true, x: B, minPivotRatio };
};

/* ---------- análisis de un marco ----------
 * model = { nodes:[{x,y}], elems:[{i,j,E,A,I}], restr:[[ux,uy,rz]...] }
 * loadSet = { nodal:[{n,fx,fy,mz}], elem:[{e, ...carga}] }  — o un arreglo de ellos
 *   (primer orden: una sola factorización, varios vectores de carga).
 * opts = { secondOrder, maxIter, tol, stiffFactor:{EA, EI} }
 */
NX.analyze = function (model, loadSet, opts = {}) {
  const multi = Array.isArray(loadSet);
  if (multi && opts.secondOrder) throw new Error('El análisis de segundo orden se resuelve por combinación.');
  const sets = multi ? loadSet : [loadSet];
  const { nodes, elems, restr } = model;
  const nn = nodes.length, ndof = 3 * nn;
  const fEA = opts.stiffFactor?.EA ?? 1, fEI = opts.stiffFactor?.EI ?? 1;
  // numeración de GDL libres (se conserva el orden nodal para mantener la banda estrecha)
  const map = new Int32Array(ndof).fill(-1);
  let nf = 0;
  for (let n = 0; n < nn; n++) for (let d = 0; d < 3; d++) if (!(restr[n] && restr[n][d])) map[3 * n + d] = nf++;
  if (nf === 0) throw new Error('El modelo no tiene grados de libertad libres.');
  const E = elems.map((el, k) => {
    const g = NX.elemGeom(nodes, el);
    const kl = NX.kLocal(el.E, el.A * fEA, el.I * fEI, g.L);
    const dofs = [3 * el.i, 3 * el.i + 1, 3 * el.i + 2, 3 * el.j, 3 * el.j + 1, 3 * el.j + 2];
    return { g, kl, dofs, k };
  });
  let hb = 0;
  for (const e of E) {
    const f = e.dofs.map((d) => map[d]).filter((d) => d >= 0);
    for (const a of f) for (const b of f) hb = Math.max(hb, Math.abs(a - b));
  }
  // cargas por conjunto
  const L = sets.map((set) => {
    const pieces = E.map(() => []);
    for (const ld of set.elem || []) {
      if (!E[ld.e]) throw new Error('Carga en barra inexistente ' + ld.e);
      pieces[ld.e].push(...NX.localPieces(ld, E[ld.e].g));
    }
    const fe = E.map((e, q) => NX.equivLocal(pieces[q], e.g.L));
    const Fn = new Float64Array(ndof);
    for (const ld of set.nodal || []) { Fn[3 * ld.n] += ld.fx || 0; Fn[3 * ld.n + 1] += ld.fy || 0; Fn[3 * ld.n + 2] += ld.mz || 0; }
    const Ff = new Float64Array(nf);
    for (let d = 0; d < ndof; d++) if (map[d] >= 0) Ff[map[d]] += Fn[d];
    E.forEach((e, q) => {
      const fg = NX.vecToGlobal(fe[q], e.g.c, e.g.s);
      for (let a = 0; a < 6; a++) { const i = map[e.dofs[a]]; if (i >= 0) Ff[i] += fg[a]; }
    });
    return { set, pieces, fe, Fn, Ff };
  });
  const w = 2 * hb + 1;
  const kgLin = E.map((e) => NX.toGlobal(e.kl, e.g.c, e.g.s));
  const assemble = (Nax) => {
    const A = new Float64Array(nf * w);
    const kls = E.map((e, q) => {
      let k = e.kl, kg = kgLin[q];
      if (Nax) {
        const g = NX.kGeom(Nax[q], e.g.L);
        k = k.map((r, i) => r.map((v, j) => v + g[i][j]));
        const gg = NX.toGlobal(g, e.g.c, e.g.s);
        kg = kg.map((r, i) => r.map((v, j) => v + gg[i][j]));
      }
      for (let a = 0; a < 6; a++) {
        const ia = map[e.dofs[a]]; if (ia < 0) continue;
        const row = ia * w - ia + hb;
        for (let b = 0; b < 6; b++) { const ib = map[e.dofs[b]]; if (ib < 0) continue; A[row + ib] += kg[a][b]; }
      }
      return k;
    });
    return { A, kls };
  };
  const expand = (x) => { const D = new Float64Array(ndof); for (let d = 0; d < ndof; d++) if (map[d] >= 0) D[d] = x[map[d]]; return D; };
  const post = (D, kls, ld, N2) => {
    const R = new Float64Array(ndof);
    const members = E.map((e, q) => {
      const dl = NX.vecToLocal(e.dofs.map((d) => D[d]), e.g.c, e.g.s);
      const s = new Array(6);
      for (let i = 0; i < 6; i++) { let v = 0; for (let j = 0; j < 6; j++) v += kls[q][i][j] * dl[j]; s[i] = v - ld.fe[q][i]; }
      const sg = NX.vecToGlobal(s, e.g.c, e.g.s);
      for (let a = 0; a < 6; a++) R[e.dofs[a]] += sg[a];
      return { k: q, L: e.g.L, c: e.g.c, s: e.g.s, end: s, dl, pieces: ld.pieces[q], N2: N2 ? N2[q] : 0 };
    });
    for (let d = 0; d < ndof; d++) R[d] -= ld.Fn[d];
    const reactions = [];
    for (let n = 0; n < nn; n++) if (restr[n] && restr[n].some(Boolean)) {
      reactions.push({ n, fx: restr[n][0] ? R[3 * n] : 0, fy: restr[n][1] ? R[3 * n + 1] : 0, mz: restr[n][2] ? R[3 * n + 2] : 0 });
    }
    return { ok: true, D, members, reactions, loadSet: ld.set };
  };
  const fail = (iter) => ({ ok: false, unstable: true, iter, reason: opts.secondOrder && iter > 0
    ? 'Inestabilidad elástica: la rigidez con efectos P-Δ deja de ser positiva (carga cercana o superior a la crítica).'
    : 'Matriz singular: mecanismo, nodo aislado o restricciones insuficientes (ec. 37).' });

  if (!opts.secondOrder) {
    const { A, kls } = assemble(null);
    const sol = NX.bandSolve(nf, hb, A, L.map((l) => l.Ff));
    if (!sol.ok) return multi ? sets.map(() => fail(0)) : fail(0);
    const res = L.map((ld, q) => ({ ...post(expand(sol.x[q]), kls, ld, null), iter: 0, converged: true, minPivot: sol.minPivotRatio }));
    return multi ? res : res[0];
  }
  // segundo orden: iteración con la matriz geométrica (fuerza axial media de cada barra)
  const ld = L[0];
  let Nax = new Float64Array(E.length), iter = 0, last = null, converged = false;
  const maxIter = opts.maxIter ?? 30, tol = opts.tol ?? 1e-4;
  while (true) {
    const { A, kls } = assemble(iter === 0 ? null : Nax);
    const sol = NX.bandSolve(nf, hb, A, [ld.Ff]);
    if (!sol.ok) return fail(iter);
    const D = expand(sol.x[0]);
    last = { D, kls, minPivot: sol.minPivotRatio };
    let dmax = 0, nmax = 0;
    const Nnew = new Float64Array(E.length);
    E.forEach((e, q) => {
      const dl = NX.vecToLocal(e.dofs.map((d) => D[d]), e.g.c, e.g.s);
      const ea = e.kl[0][0];
      const si = ea * (dl[0] - dl[3]) - ld.fe[q][0], sj = ea * (dl[3] - dl[0]) - ld.fe[q][3];
      Nnew[q] = (-si + sj) / 2;
      dmax = Math.max(dmax, Math.abs(Nnew[q] - Nax[q])); nmax = Math.max(nmax, Math.abs(Nnew[q]));
    });
    iter++;
    const prevN = Nax; Nax = Nnew;
    if (iter > 1 && dmax <= tol * Math.max(nmax, 1)) { converged = true; break; }
    if (iter >= maxIter) break;
    void prevN;
  }
  const out = post(last.D, last.kls, ld, Nax);
  return { ...out, iter, converged, minPivot: last.minPivot };
};

/* ---------- esfuerzos interiores (ec. 40–42) ----------
 * Convención: N tensión +, V tal que dM/dx = V, M positivo comprime la fibra +y local.
 * Para un momento de segundo orden (P-δ) se agrega el término N·(v(x)-cuerda) aproximado
 * mediante la deformada interpolada.
 */
NX.internalAt = function (mem, x) {
  const s = mem.end;
  let N = -s[0], V = s[1], M = -s[2] + s[1] * x;
  for (const p of mem.pieces) {
    if (p.k === 'dist') {
      if (x <= p.a) continue;
      const xe = Math.min(x, p.b), d = p.b - p.a, u = xe - p.a;
      const dq = (p.qb - p.qa) / d, dp = (p.pb - p.pa) / d;
      const Q = p.qa * u + dq * u * u / 2;
      const P = p.pa * u + dp * u * u / 2;
      // momento de la carga parcial respecto del corte en x
      let Mq;
      if (x <= p.b) Mq = p.qa * u * u / 2 + dq * u * u * u / 6;
      else {
        const Qt = p.qa * d + dq * d * d / 2;
        Mq = Qt * (x - p.a) - (p.qa * d * d / 2 + dq * d * d * d / 3);
      }
      N -= P; V += Q; M += Mq;
    } else if (p.k === 'pt') {
      if (x < p.x - 1e-9) continue;
      N -= p.Px; V += p.Py; M += p.Py * (x - p.x);
    } else if (p.k === 'mom') {
      if (x < p.x - 1e-9) continue;
      M -= p.M;
    }
  }
  return { N, V, M };
};

// desplazamiento transversal local por interpolación cúbica (aproximado entre nodos)
NX.deflAt = function (mem, x) {
  const d = mem.dl, N = NX.shape(x / mem.L, mem.L);
  return { u: N.Na1 * d[0] + N.Na2 * d[3], v: N.N1 * d[1] + N.N2 * d[2] + N.N3 * d[4] + N.N4 * d[5] };
};

// estaciones de evaluación: extremos, discontinuidades y n divisiones
NX.stations = function (mem, n = 8) {
  const xs = new Set([0, mem.L]);
  for (let i = 1; i < n; i++) xs.add(mem.L * i / n);
  for (const p of mem.pieces) {
    if (p.k === 'dist') { xs.add(p.a); xs.add(p.b); }
    else { xs.add(Math.max(0, p.x - 1e-6)); xs.add(Math.min(mem.L, p.x + 1e-6)); }
  }
  return [...xs].filter((x) => x >= 0 && x <= mem.L).sort((a, b) => a - b);
};

// equilibrio global: Σ cargas + Σ reacciones ≈ 0 (fuerzas y momento respecto al origen)
NX.equilibrium = function (model, res) {
  let Fx = 0, Fy = 0, Mo = 0;
  const { nodes, elems } = model;
  for (const ld of res.loadSet.nodal || []) {
    const p = nodes[ld.n];
    Fx += ld.fx || 0; Fy += ld.fy || 0; Mo += (ld.mz || 0) + p.x * (ld.fy || 0) - p.y * (ld.fx || 0);
  }
  for (const m of res.members) {
    const el = elems[m.k], a = nodes[el.i];
    for (const p of m.pieces) {
      let px = 0, py = 0, x0 = 0, mz = 0;
      if (p.k === 'dist') {
        const h = (p.b - p.a) / 2, mid = (p.a + p.b) / 2;
        for (const [t, w] of GP) {
          const x = mid + h * t, r = (x - p.a) / (p.b - p.a), ww = w * h;
          const pp = (p.pa + (p.pb - p.pa) * r) * ww, qq = (p.qa + (p.qb - p.qa) * r) * ww;
          const gx = m.c * pp - m.s * qq, gy = m.s * pp + m.c * qq;
          const X = a.x + m.c * x, Y = a.y + m.s * x;
          Fx += gx; Fy += gy; Mo += X * gy - Y * gx;
        }
        continue;
      }
      if (p.k === 'pt') { px = m.c * p.Px - m.s * p.Py; py = m.s * p.Px + m.c * p.Py; x0 = p.x; }
      if (p.k === 'mom') { mz = p.M; x0 = p.x; }
      const X = a.x + m.c * x0, Y = a.y + m.s * x0;
      Fx += px; Fy += py; Mo += mz + X * py - Y * px;
    }
  }
  for (const r of res.reactions) {
    const p = nodes[r.n];
    Fx += r.fx; Fy += r.fy; Mo += r.mz + p.x * r.fy - p.y * r.fx;
  }
  return { Fx, Fy, Mo };
};

// ---- aisc.js
/* ============================================================
 * Comprobaciones de acero por familia (referencia AISC 360-22)
 * Guía caps. 7, 8 y 9. Unidades N, mm, MPa.
 * Cada función devuelve el valor nominal, la rama aplicada y
 * los datos intermedios para el reporte. Una rama no implementada
 * se devuelve como {scope:false, why}, nunca como cumplimiento.
 * ============================================================ */

NX.FACT = {
  flex: { phi: 0.90, omega: 1.67 },
  comp: { phi: 0.90, omega: 1.67 },
  tens: { phi: 0.90, omega: 1.67 },
  shearRolled: { phi: 1.00, omega: 1.50 },
  shear: { phi: 0.90, omega: 1.67 },
};

// familias con rama implementada como miembro principal del marco
NX.FAMILY_KIND = { IR: 'I', IE: 'I', IS: 'I', ORR: 'HSSR', ORC: 'HSSR', OC: 'HSSC' };
NX.OUT_OF_SCOPE_WHY = {
  CE: 'Canal: requiere flexión con centro de cortante excéntrico y torsión (F11/E4 flexotorsional); rama no implementada.',
  TR: 'Perfil T: flexión F9 y pandeo flexotorsional con simetría simple; rama no implementada.',
  IC: 'Cruciforme: pandeo torsional dominante y flexión no cubierta por F2; rama no implementada.',
  LI: 'Ángulo: ejes principales inclinados y excentricidad (F10, E5); fuera del modelo plano.',
  LD: 'Ángulo desigual: ejes principales inclinados (F10, E5); fuera del modelo plano.',
  OS: 'Redondo sólido: uso como tensor o contraviento, no como viga o columna de marco.',
  CF: 'Formado en frío: requiere AISI S100 (sección efectiva o resistencia directa).',
  ZF: 'Formado en frío: requiere AISI S100 (sección efectiva o resistencia directa).',
};

NX.available = function (Rn, f, method) {
  return method === 'ASD' ? Rn / f.omega : f.phi * Rn;
};

// propiedades indispensables por tipo (Guía 3.1: si faltan, información insuficiente)
NX.REQUIRED = {
  I: ['A', 'd', 'bf', 'tf', 'tw', 'Ix', 'Iy', 'Sx', 'Zx', 'rx', 'ry', 'J', 'Cw', 'lf', 'lw'],
  HSSR: ['A', 'd', 'B', 't', 'Ix', 'Iy', 'Sx', 'Zx', 'rx', 'ry', 'J', 'lf', 'lw'],
  HSSC: ['A', 'D', 't', 'Ix', 'Sx', 'Zx', 'rx', 'lw'],
};

NX.sectionStatus = function (sec) {
  const kind = NX.FAMILY_KIND[sec.fam];
  if (!kind) return { ok: false, status: 'alcance', why: NX.OUT_OF_SCOPE_WHY[sec.fam] || 'Familia sin rama de comprobación implementada.' };
  const miss = NX.REQUIRED[kind].filter((k) => !(sec[k] > 0));
  if (miss.length) return { ok: false, status: 'insuficiente', why: 'Faltan propiedades en el catálogo: ' + miss.join(', ') };
  return { ok: true, kind };
};

// ---------- clasificación por flexión (Guía 7.2, ecs. 45–47) ----------
NX.classifyFlex = function (sec, mat) {
  const { E, Fy } = mat, r = Math.sqrt(E / Fy);
  const kind = NX.FAMILY_KIND[sec.fam];
  if (kind === 'I') {
    const welded = sec.fam === 'IS';
    const kc = Math.min(0.76, Math.max(0.35, 4 / Math.sqrt(sec.lw)));
    const lpf = 0.38 * r;
    const lrf = welded ? 0.95 * Math.sqrt(kc * E / (0.7 * Fy)) : 1.0 * r;
    const lpw = 3.76 * r, lrw = 5.70 * r;
    return {
      kind, kc, welded,
      flange: { lam: sec.lf, lp: lpf, lr: lrf, cls: sec.lf <= lpf ? 'compacto' : sec.lf <= lrf ? 'no compacto' : 'esbelto' },
      web: { lam: sec.lw, lp: lpw, lr: lrw, cls: sec.lw <= lpw ? 'compacto' : sec.lw <= lrw ? 'no compacto' : 'esbelto' },
    };
  }
  if (kind === 'HSSR') {
    const lpf = 1.12 * r, lrf = 1.40 * r, lpw = 2.42 * r, lrw = 5.70 * r;
    return {
      kind,
      flange: { lam: sec.lf, lp: lpf, lr: lrf, cls: sec.lf <= lpf ? 'compacto' : sec.lf <= lrf ? 'no compacto' : 'esbelto' },
      web: { lam: sec.lw, lp: lpw, lr: lrw, cls: sec.lw <= lpw ? 'compacto' : sec.lw <= lrw ? 'no compacto' : 'esbelto' },
    };
  }
  if (kind === 'HSSC') {
    const lp = 0.07 * E / Fy, lr = 0.31 * E / Fy;
    return { kind, wall: { lam: sec.lw, lp, lr, cls: sec.lw <= lp ? 'compacto' : sec.lw <= lr ? 'no compacto' : 'esbelto' } };
  }
  return { kind: null };
};

// ---------- Cb (ec. 54) ----------
NX.Cb = function (Mmax, MA, MB, MC) {
  const den = 2.5 * Mmax + 3 * MA + 4 * MB + 3 * MC;
  if (!(Mmax > 0) || !(den > 0)) return 1.0;
  return Math.min(3.0, 12.5 * Mmax / den);
};

// ---------- flexión eje mayor ----------
NX.flexure = function (sec, mat, Lb, Cb = 1) {
  const { E, Fy } = mat;
  const cl = NX.classifyFlex(sec, mat);
  const Mp = Fy * sec.Zx;
  if (cl.kind === 'I') {
    if (cl.web.cls !== 'compacto') {
      return { scope: false, why: `Alma ${cl.web.cls} en flexión (h/tw = ${sec.lw.toFixed(1)} > λp = ${cl.web.lp.toFixed(1)}): requiere F4/F5, no implementadas.` };
    }
    // pandeo lateral-torsional (ecs. 48–53)
    const ho = sec.d - sec.tf;
    const rts = Math.sqrt(Math.sqrt(sec.Iy * sec.Cw) / sec.Sx);
    const Lp = 1.76 * sec.ry * Math.sqrt(E / Fy);
    const eta = sec.J * 1 / (sec.Sx * ho);
    const Lr = 1.95 * rts * E / (0.7 * Fy) * Math.sqrt(eta + Math.sqrt(eta * eta + 6.76 * Math.pow(0.7 * Fy / E, 2)));
    let Mltb, ltbCase;
    if (Lb <= Lp) { Mltb = Mp; ltbCase = 'Lb ≤ Lp: fluencia'; }
    else if (Lb <= Lr) { Mltb = Math.min(Mp, Cb * (Mp - (Mp - 0.7 * Fy * sec.Sx) * (Lb - Lp) / (Lr - Lp))); ltbCase = 'Lp < Lb ≤ Lr: PLT inelástico (ec. 51)'; }
    else {
      const Fcr = Cb * Math.PI ** 2 * E / Math.pow(Lb / rts, 2) * Math.sqrt(1 + 0.078 * eta * Math.pow(Lb / rts, 2));
      Mltb = Math.min(Mp, Fcr * sec.Sx); ltbCase = 'Lb > Lr: PLT elástico (ecs. 52–53)';
    }
    let Mflb = Mp, flbCase = 'patín compacto';
    const f = cl.flange;
    if (f.cls === 'no compacto') { Mflb = Mp - (Mp - 0.7 * Fy * sec.Sx) * (f.lam - f.lp) / (f.lr - f.lp); flbCase = 'patín no compacto (F3-1)'; }
    else if (f.cls === 'esbelto') { Mflb = 0.9 * E * cl.kc * sec.Sx / (f.lam * f.lam); flbCase = 'patín esbelto (F3-2)'; }
    const Mn = Math.min(Mp, Mltb, Mflb);
    return {
      scope: true, Mn, Mp, Lp, Lr, Lb, Cb, rts, ho, eta,
      branch: f.cls === 'compacto' ? 'AISC F2' : 'AISC F3',
      gov: Mn === Mp ? 'fluencia' : Mn === Mltb ? 'pandeo lateral-torsional' : 'pandeo local del patín',
      ltbCase, flbCase, cl,
    };
  }
  if (cl.kind === 'HSSR') {
    if (cl.flange.cls === 'esbelto' || cl.web.cls === 'esbelto') {
      return { scope: false, why: 'PTR con pared esbelta en flexión: requiere ancho efectivo (F7-3/F7-6), no implementado.' };
    }
    let Mn = Mp, gov = 'fluencia';
    if (cl.flange.cls === 'no compacto') {
      const v = Math.min(Mp, Mp - (Mp - Fy * sec.Sx) * (3.57 * sec.lf * Math.sqrt(Fy / E) - 4.0));
      if (v < Mn) { Mn = v; gov = 'pandeo local del patín (F7-2)'; }
    }
    if (cl.web.cls === 'no compacto') {
      const v = Math.min(Mp, Mp - (Mp - Fy * sec.Sx) * (0.305 * sec.lw * Math.sqrt(Fy / E) - 0.738));
      if (v < Mn) { Mn = v; gov = 'pandeo local del alma (F7-5)'; }
    }
    // F7.4 pandeo lateral-torsional (sólo relevante en secciones peraltadas)
    const JA = Math.sqrt(sec.J * sec.A);
    const Lp = 0.13 * E * sec.ry * JA / Mp, Lr = 2 * E * sec.ry * JA / (0.7 * Fy * sec.Sx);
    let Mltb = Mp;
    if (Lb > Lp && Lb <= Lr) Mltb = Math.min(Mp, Cb * (Mp - (Mp - 0.7 * Fy * sec.Sx) * (Lb - Lp) / (Lr - Lp)));
    else if (Lb > Lr) Mltb = Math.min(Mp, 2 * E * Cb * JA / (Lb / sec.ry));
    if (Mltb < Mn) { Mn = Mltb; gov = 'pandeo lateral-torsional (F7.4)'; }
    return { scope: true, Mn, Mp, Lp, Lr, Lb, Cb, branch: 'AISC F7', gov, cl };
  }
  if (cl.kind === 'HSSC') {
    const Dt = sec.lw;
    if (Dt >= 0.45 * E / Fy) return { scope: false, why: 'D/t ≥ 0.45E/Fy: fuera del alcance de F8.' };
    let Mn, gov;
    if (cl.wall.cls === 'compacto') { Mn = Mp; gov = 'fluencia'; }
    else if (cl.wall.cls === 'no compacto') { Mn = Math.min(Mp, (0.021 * E / Dt + Fy) * sec.Sx); gov = 'pandeo local (F8-2)'; }
    else { Mn = Math.min(Mp, 0.33 * E / Dt * sec.Sx); gov = 'pandeo local (F8-3)'; }
    return { scope: true, Mn, Mp, Lb, Cb, branch: 'AISC F8', gov, cl };
  }
  return { scope: false, why: 'Familia sin rama de flexión.' };
};

// ---------- cortante (ec. 56) ----------
NX.shear = function (sec, mat, Lv) {
  const { E, Fy } = mat, kind = NX.FAMILY_KIND[sec.fam];
  if (kind === 'I') {
    const Aw = sec.d * sec.tw, htw = sec.lw;
    const rolled = sec.fam !== 'IS';
    if (rolled && htw <= 2.24 * Math.sqrt(E / Fy)) {
      return { scope: true, Vn: 0.6 * Fy * Aw, Cv: 1, Aw, f: NX.FACT.shearRolled, branch: 'AISC G2.1(a)', note: 'h/tw ≤ 2.24√(E/Fy): φv = 1.00, Ωv = 1.50' };
    }
    const kv = 5.34, lim = 1.10 * Math.sqrt(kv * E / Fy);
    const Cv = htw <= lim ? 1 : lim / htw;
    return { scope: true, Vn: 0.6 * Fy * Aw * Cv, Cv, Aw, f: NX.FACT.shear, branch: 'AISC G2.1(b)', note: `kv = 5.34, Cv1 = ${Cv.toFixed(3)}` };
  }
  if (kind === 'HSSR') {
    const h = sec.lw * sec.t, Aw = 2 * h * sec.t, ht = sec.lw, kv = 5;
    const a = 1.10 * Math.sqrt(kv * E / Fy), b = 1.37 * Math.sqrt(kv * E / Fy);
    const Cv = ht <= a ? 1 : ht <= b ? a / ht : 1.51 * kv * E / (ht * ht * Fy);
    return { scope: true, Vn: 0.6 * Fy * Aw * Cv, Cv, Aw, f: NX.FACT.shear, branch: 'AISC G4', note: `h = ${h.toFixed(0)} mm, Cv2 = ${Cv.toFixed(3)}` };
  }
  if (kind === 'HSSC') {
    const Dt = sec.lw, D = sec.D, L = Math.max(Lv || 1000, D);
    const Fcr = Math.min(0.6 * Fy, Math.max(1.60 * E / (Math.sqrt(L / D) * Math.pow(Dt, 1.25)), 0.78 * E / Math.pow(Dt, 1.5)));
    return { scope: true, Vn: Fcr * sec.A / 2, Cv: Fcr / (0.6 * Fy), f: NX.FACT.shear, branch: 'AISC G5', note: `Fcr = ${Fcr.toFixed(0)} MPa` };
  }
  return { scope: false, why: 'Familia sin rama de cortante.' };
};

// ---------- compresión (ecs. 61–65, E4, E7) ----------
NX.compression = function (sec, mat, Lcx, Lcy, Lcz) {
  const { E, Fy, G } = mat, kind = NX.FAMILY_KIND[sec.fam];
  const sx = Lcx / sec.rx, sy = Lcy / sec.ry;
  const Fex = Math.PI ** 2 * E / (sx * sx), Fey = Math.PI ** 2 * E / (sy * sy);
  let Fe = Math.min(Fex, Fey), mode = Fex < Fey ? 'pandeo flexional en el plano (x)' : 'pandeo flexional fuera del plano (y)';
  if (kind === 'I' && sec.Cw > 0 && sec.J > 0) {
    const Fez = (Math.PI ** 2 * E * sec.Cw / (Lcz * Lcz) + G * sec.J) / (sec.Ix + sec.Iy);
    if (Fez < Fe) { Fe = Fez; mode = 'pandeo torsional (E4)'; }
  }
  const crit = (fe) => (Fy / fe <= 2.25 ? Math.pow(0.658, Fy / fe) * Fy : 0.877 * fe);
  const Fcr = crit(Fe);
  // elementos esbeltos y área efectiva (E7)
  const r = Math.sqrt(E / Fy);
  const elems = [];
  if (kind === 'I') {
    const kc = Math.min(0.76, Math.max(0.35, 4 / Math.sqrt(sec.lw)));
    const lrF = sec.fam === 'IS' ? 0.64 * Math.sqrt(kc * E / Fy) : 0.56 * r;
    elems.push({ name: 'patín', lam: sec.lf, lr: lrF, b: sec.bf / 2, t: sec.tf, n: 4, c1: 0.22, c2: 1.49 });
    elems.push({ name: 'alma', lam: sec.lw, lr: 1.49 * r, b: sec.lw * sec.tw, t: sec.tw, n: 1, c1: 0.18, c2: 1.31 });
  } else if (kind === 'HSSR') {
    elems.push({ name: 'pared b', lam: sec.lf, lr: 1.40 * r, b: sec.lf * sec.t, t: sec.t, n: 2, c1: 0.20, c2: 1.38 });
    elems.push({ name: 'pared h', lam: sec.lw, lr: 1.40 * r, b: sec.lw * sec.t, t: sec.t, n: 2, c1: 0.20, c2: 1.38 });
  }
  let Ae = sec.A, slender = [];
  if (kind === 'HSSC') {
    const Dt = sec.lw;
    if (Dt > 0.45 * E / Fy) return { scope: false, why: 'D/t > 0.45E/Fy: fuera del alcance de E7.' };
    if (Dt > 0.11 * E / Fy) { Ae = sec.A * (0.038 * E / (Fy * Dt) + 2 / 3); slender.push('pared (D/t)'); }
  } else {
    for (const el of elems) {
      if (el.lam <= el.lr * Math.sqrt(Fy / Fcr)) continue;
      const Fel = Math.pow(el.c2 * el.lr / el.lam, 2) * Fy;
      const be = Math.min(el.b, el.b * (1 - el.c1 * Math.sqrt(Fel / Fcr)) * Math.sqrt(Fel / Fcr));
      Ae -= el.n * (el.b - be) * el.t;
      slender.push(el.name);
    }
  }
  const Pn = Fcr * Ae;
  return {
    scope: true, Pn, Fcr, Fe, Fex, Fey, mode, Ae, slender,
    KLr: Math.max(sx, sy), sx, sy, branch: slender.length ? 'AISC E3 + E7' : (mode.includes('torsional') ? 'AISC E4' : 'AISC E3'),
  };
};

// ---------- interacción H1-1 (ecs. 66–67) ----------
NX.interaction = function (Pr, Pc, Mr, Mc) {
  const p = Pc > 0 ? Math.abs(Pr) / Pc : Infinity;
  const m = Mc > 0 ? Math.abs(Mr) / Mc : Infinity;
  if (p >= 0.2) return { eta: p + 8 / 9 * m, eq: 'H1-1a', p, m };
  return { eta: p / 2 + m, eq: 'H1-1b', p, m };
};

// ---- model.js
/* ============================================================
 * Geometría, cubierta, polines, acciones y combinaciones
 * Guía caps. 2 a 5 (ecs. 5–25, A1–A2).
 * Entradas del proyecto en m, kN, kg; salida del modelo en N y mm.
 * ============================================================ */

NX.G = 9.80665;

// ---------- geometría (ecs. 5–7, 9) ----------
NX.geometry = function (p) {
  const e = p.estructura;
  const B = e.B * 1000;
  const H = e.H * 1000;
  let H2 = H, h = 0;
  if (e.techo === 'dos') {
    h = e.entradaAltura === 'pendiente' ? (e.B / 2) * e.pendiente / 100 * 1000 : (e.hc - e.H) * 1000;
  } else if (e.techo === 'una') {
    H2 = e.entradaAltura === 'pendiente' ? H + e.B * e.pendiente / 100 * 1000 : e.H2 * 1000;
  }
  const errors = [];
  if (!(B > 0)) errors.push('El claro debe ser mayor que cero.');
  if (!(H > 0)) errors.push('La altura de columnas debe ser mayor que cero.');
  if (e.techo === 'dos' && !(h >= 0)) errors.push('La cumbrera no puede quedar por debajo del alero.');
  if (e.techo === 'una' && !(H2 > 0)) errors.push('La altura del alero derecho debe ser mayor que cero.');
  const pts = { baseL: { x: 0, y: 0 }, eaveL: { x: 0, y: H }, eaveR: { x: B, y: H2 }, baseR: { x: B, y: 0 } };
  const members = [{ id: 'colL', kind: 'col', label: 'Columna izquierda', a: pts.baseL, b: pts.eaveL }];
  if (e.techo === 'dos') {
    pts.ridge = { x: B / 2, y: H + h };
    members.push({ id: 'rafL', kind: 'beam', label: 'Viga izquierda', a: pts.eaveL, b: pts.ridge });
    members.push({ id: 'rafR', kind: 'beam', label: 'Viga derecha', a: pts.ridge, b: pts.eaveR });
  } else {
    members.push({ id: 'rafL', kind: 'beam', label: e.techo === 'plana' ? 'Viga' : 'Viga inclinada', a: pts.eaveL, b: pts.eaveR });
  }
  members.push({ id: 'colR', kind: 'col', label: 'Columna derecha', a: pts.baseR, b: pts.eaveR });
  for (const m of members) {
    m.dx = m.b.x - m.a.x; m.dy = m.b.y - m.a.y; m.L = Math.hypot(m.dx, m.dy);
    m.c = m.dx / m.L; m.s = m.dy / m.L;
  }
  const rafters = members.filter((m) => m.kind === 'beam');
  const theta = Math.atan2(Math.abs(rafters[0].dy), Math.abs(rafters[0].dx));
  const D = e.tipoMarco === 'varios' ? (e.nMarcos - 1) * e.sep * 1000 : (e.anchoTrib || e.sep) * 1000;
  // áreas (ecs. 5–7)
  const Ah = B * D / 1e6;
  const As = rafters.reduce((s, m) => s + m.L, 0) * D / 1e6;
  return {
    B, H, H2, h, pts, members, rafters, theta, D, Ah, As, errors,
    pendiente: rafters.length ? Math.abs(rafters[0].dy / rafters[0].dx) * 100 : 0,
    hMax: Math.max(H, H2, pts.ridge ? pts.ridge.y : 0),
  };
};

// ---------- cubierta y carga muerta (ecs. 10–14, A1–A2) ----------
NX.coverLoad = function (p) {
  const c = p.cubierta;
  const parts = [];
  const g = NX.G;
  if (c.sistema === 'LOSACERO') {
    const L = c.losacero;
    // ec. A1: volumen equivalente de concreto por m²
    const veq = L.tsup / 1000 + (L.hr / 1000) * (L.wr / L.sr); // m³/m²
    parts.push({ name: `Lámina deck cal. ${L.calibre}`, q: L.masaDeck * g / 1000, src: 'Ficha del fabricante (capturada)', eq: 'ec. 10' });
    parts.push({ name: `Concreto (veq = ${(veq * 1000).toFixed(1)} mm)`, q: L.gamma * veq, src: `γ = ${L.gamma} kN/m³`, eq: 'ec. A1' });
    if (L.refuerzo) parts.push({ name: 'Refuerzo / malla', q: L.refuerzo * g / 1000, src: 'Capturado', eq: 'ec. 10' });
  } else {
    const L = c.lamina;
    const mA = L.masaManual > 0 ? L.masaManual : 7850 * (L.t / 1000) * L.factor;
    parts.push({
      name: `${c.sistema === 'KR18' ? 'KR-18' : 'R-100'} cal. ${L.calibre}`,
      q: mA * g / 1000,
      src: L.masaManual > 0 ? 'Masa capturada de ficha técnica' : `ρ·t·f = 7850 × ${L.t} mm × ${L.factor} = ${mA.toFixed(2)} kg/m²`,
      eq: 'ec. 10',
    });
  }
  for (const k of c.capas || []) {
    if (!(k.masa > 0)) continue;
    parts.push({ name: k.nombre, q: k.masa * g / 1000, src: 'Capa capturada', eq: 'ec. 11' });
  }
  const q = parts.reduce((s, x) => s + x.q, 0);
  return { parts, q }; // kN/m² sobre superficie inclinada
};

// ---------- polines: posiciones reales y anchos tributarios (Guía 10.1 y ec. 20) ----------
NX.purlinLayout = function (geo, p) {
  const sMax = p.polines.sepMax * 1000;
  const lines = [];
  for (const m of geo.rafters) {
    const n = Math.max(1, Math.ceil(m.L / sMax - 1e-9));
    const s = m.L / n;
    for (let k = 0; k <= n; k++) {
      const pos = k * s;
      const trib = (k === 0 || k === n) ? s / 2 : s;
      lines.push({ member: m.id, pos, trib, s });
    }
  }
  return { lines, count: lines.length, spacing: geo.rafters.map((m) => m.L / Math.max(1, Math.ceil(m.L / sMax - 1e-9))) };
};

// ---------- reparto longitudinal: factor de ancho efectivo del marco ----------
// Polín simplemente apoyado: marco interior a, extremo a/2.
// Polín continuo: reacciones de una viga continua sobre N apoyos (Guía 5.1).
NX.frameShare = function (p) {
  const e = p.estructura;
  if (e.tipoMarco !== 'varios') {
    return { a: (e.anchoTrib || e.sep) * 1000, coef: 1, note: 'Marco simple: ancho tributario capturado.' };
  }
  const a = e.sep * 1000, N = Math.max(2, Math.round(e.nMarcos));
  const interior = e.marcoAnalizado !== 'extremo';
  if (p.polines.continuidad !== 'continuo' || N < 3) {
    const coef = interior && N > 2 ? 1 : 0.5;
    return { a: coef * a, coef, note: `Polín simplemente apoyado: ${interior && N > 2 ? 'marco interior (a)' : 'marco extremo (a/2)'}.` };
  }
  // viga continua de N apoyos, carga unitaria
  const nodes = [], elems = [], restr = [];
  for (let i = 0; i < N; i++) { nodes.push({ x: i * a, y: 0 }); restr.push([i === 0 ? 1 : 0, 1, 0]); }
  for (let i = 0; i < N - 1; i++) elems.push({ i, j: i + 1, E: 200000, A: 1000, I: 1e7 });
  const r = NX.analyze({ nodes, elems, restr }, { elem: elems.map((_, k) => ({ e: k, type: 'dist', dir: 'gy', a: 0, b: 1, qa: -1 })) });
  const R = r.reactions.map((x) => x.fy / a);
  const coefInt = Math.max(...R.slice(1, -1));
  const coef = interior ? coefInt : R[0];
  return { a: coef * a, coef, coefs: R, note: `Polín continuo de ${N - 1} claros: coeficiente ${coef.toFixed(3)}·a (${interior ? 'marco interior más cargado' : 'marco extremo'}).` };
};

// ---------- malla del marco ----------
// Cada miembro físico se divide en los puntos de polines, cargas puntuales y subdivisiones.
NX.buildMesh = function (geo, p, purl) {
  const nodes = [], elems = [], restr = [];
  const key = (pt) => Math.round(pt.x * 10) + ':' + Math.round(pt.y * 10);
  const index = new Map();
  const addNode = (pt) => {
    const k = key(pt);
    if (index.has(k)) return index.get(k);
    nodes.push({ x: pt.x, y: pt.y }); restr.push([0, 0, 0]);
    index.set(k, nodes.length - 1); return nodes.length - 1;
  };
  const brk = {};
  for (const m of geo.members) {
    const set = new Set([0, m.L]);
    const nSub = m.kind === 'col' ? 8 : Math.max(6, Math.ceil(m.L / 750));
    for (let i = 1; i < nSub; i++) set.add(m.L * i / nSub);
    for (const l of purl.lines) if (l.member === m.id) set.add(l.pos);
    for (const q of p.cargas.equipos || []) {
      const pos = NX.posOnMember(geo, m, q.x * 1000);
      if (pos != null) set.add(pos);
    }
    for (const q of p.cargas.extra || []) {
      if (q.miembro !== m.id) continue;
      if (q.tipo === 'puntual' || q.tipo === 'momento') set.add(Math.min(m.L, Math.max(0, q.x * 1000)));
      if (q.tipo === 'parcial' || q.tipo === 'trapecio') { set.add(Math.min(m.L, q.a * 1000)); set.add(Math.min(m.L, q.b * 1000)); }
    }
    brk[m.id] = [...set].sort((a, b) => a - b).filter((v, i, arr) => i === 0 || v - arr[i - 1] > 1);
  }
  // orden de recorrido para banda estrecha: base izq → columna → vigas → columna der → base der
  const segs = {};
  const order = geo.members.map((m) => m.id);
  for (const id of order) {
    const m = geo.members.find((x) => x.id === id);
    let pos = brk[id];
    const walk = id === 'colR' ? [...pos].reverse() : pos; // columna derecha de arriba hacia abajo
    const ids = walk.map((s) => addNode({ x: m.a.x + m.c * s, y: m.a.y + m.s * s }));
    const nodeAt = id === 'colR' ? ids.reverse() : ids;
    segs[id] = [];
    for (let k = 0; k < pos.length - 1; k++) {
      elems.push({ i: nodeAt[k], j: nodeAt[k + 1], member: id, s0: pos[k], s1: pos[k + 1] });
      segs[id].push(elems.length - 1);
    }
  }
  const base = p.estructura.apoyo === 'articulado' ? [1, 1, 0] : [1, 1, 1];
  restr[addNode(geo.pts.baseL)] = base.slice();
  restr[addNode(geo.pts.baseR)] = base.slice();
  const nodeOf = (pt) => index.get(key(pt));
  return { nodes, elems, restr, segs, brk, nodeOf };
};

// posición a lo largo de un miembro de viga para una abscisa horizontal X desde el alero izquierdo
NX.posOnMember = function (geo, m, X) {
  if (m.kind !== 'beam') return null;
  const x0 = Math.min(m.a.x, m.b.x), x1 = Math.max(m.a.x, m.b.x);
  if (X < x0 - 1e-6 || X > x1 + 1e-6) return null;
  return Math.abs((X - m.a.x) / m.c);
};

// localizar sub-elemento para posición s de un miembro
NX.locate = function (mesh, memberId, s) {
  const list = mesh.segs[memberId];
  for (const e of list) {
    const el = mesh.elems[e];
    if (s >= el.s0 - 1e-6 && s <= el.s1 + 1e-6) return { e, x: s - el.s0 };
  }
  return null;
};

// carga distribuida sobre un tramo [s1,s2] de un miembro, repartida en sub-elementos (q lineal)
NX.distOnMember = function (mesh, memberId, s1, s2, qa, qb, dir, proj) {
  const out = [];
  const lin = (s) => (s2 > s1 ? qa + (qb - qa) * (s - s1) / (s2 - s1) : qa);
  for (const e of mesh.segs[memberId]) {
    const el = mesh.elems[e];
    const a = Math.max(s1, el.s0), b = Math.min(s2, el.s1);
    if (b - a <= 1e-6) continue;
    out.push({ e, type: 'dist', dir, abs: true, a: a - el.s0, b: b - el.s0, qa: lin(a), qb: lin(b), proj: proj || 'none' });
  }
  return out;
};

/* ---------- casos de carga base ----------
 * Devuelve variantes por familia: D, Lr (completa e izq/der), S, W (4), E (2).
 * Las cargas de peso propio del marco dependen del perfil y se agregan aparte (selfWeight).
 */
NX.buildCases = function (p, geo, mesh, purl, share) {
  const cv = NX.coverLoad(p);
  const kN2 = 1e-3; // kN/m² → N/mm²
  const a = share.a;
  const cases = [];
  const c = p.cargas;
  const pol = p.polines;
  const wpp = (pol.masa || 0) * NX.G / 1000; // N/mm por polín
  const qD = (cv.q + (c.otrasD || 0)) * kN2; // N/mm² sobre superficie
  const uniform = p.distribucion === 'uniforme';
  const memById = Object.fromEntries(geo.members.map((m) => [m.id, m]));

  // carga de cubierta a través de polines: superficie (sup) o proyección horizontal (hor)
  const roofLoad = (q, ref, filter) => {
    const L = [];
    if (!uniform) {
      for (const l of purl.lines) {
        if (filter && !filter(l.member)) continue;
        const m = memById[l.member];
        const cos = Math.abs(m.c);
        const w = q * l.trib * (ref === 'hor' ? cos : 1); // N/mm a lo largo del polín
        const loc = NX.locate(mesh, l.member, l.pos);
        const n = mesh.elems[loc.e];
        const node = loc.x < 1 ? n.i : n.j;
        L.push({ nodal: true, n: node, fy: -w * a });
      }
    } else {
      for (const m of geo.rafters) {
        if (filter && !filter(m.id)) continue;
        // ec. 22 (superficie) o ec. 23 (proyección horizontal): vertical por unidad de longitud inclinada
        const w = q * a * (ref === 'hor' ? Math.abs(m.c) : 1);
        L.push(...NX.distOnMember(mesh, m.id, 0, m.L, -w, -w, 'gy'));
      }
    }
    return L;
  };
  const purlinWeight = () => {
    const L = [];
    if (!wpp) return L;
    if (!uniform) {
      for (const l of purl.lines) {
        const loc = NX.locate(mesh, l.member, l.pos), n = mesh.elems[loc.e];
        L.push({ nodal: true, n: loc.x < 1 ? n.i : n.j, fy: -wpp * a });
      }
    } else {
      for (const m of geo.rafters) {
        const nP = purl.lines.filter((l) => l.member === m.id).length;
        const w = wpp * a * nP / m.L; // misma masa total (ec. 13)
        L.push(...NX.distOnMember(mesh, m.id, 0, m.L, -w, -w, 'gy'));
      }
    }
    return L;
  };
  const extraFor = (fam) => {
    const L = [];
    for (const q of c.extra || []) {
      if (q.caso !== fam) continue;
      const m = memById[q.miembro]; if (!m) continue;
      const dir = q.dir || 'gy';
      const sgn = dir === 'gy' ? -1 : 1; // gy: positivo hacia abajo en la captura
      if (q.tipo === 'puntual') {
        const loc = NX.locate(mesh, m.id, Math.min(m.L, q.x * 1000));
        if (loc) L.push({ e: loc.e, type: 'point', dir, abs: true, x: loc.x, P: sgn * q.P * 1000 });
      } else if (q.tipo === 'momento') {
        const loc = NX.locate(mesh, m.id, Math.min(m.L, q.x * 1000));
        if (loc) L.push({ e: loc.e, type: 'moment', abs: true, x: loc.x, M: q.M * 1e6 });
      } else if (q.tipo === 'uniforme') {
        L.push(...NX.distOnMember(mesh, m.id, 0, m.L, sgn * q.qa, sgn * q.qa, dir));
      } else if (q.tipo === 'parcial') {
        L.push(...NX.distOnMember(mesh, m.id, q.a * 1000, q.b * 1000, sgn * q.qa, sgn * q.qa, dir));
      } else if (q.tipo === 'trapecio') {
        L.push(...NX.distOnMember(mesh, m.id, q.a * 1000, q.b * 1000, sgn * q.qa, sgn * q.qb, dir));
      }
    }
    return L;
  };

  // ---- D (sin peso propio del marco) ----
  const D = [...roofLoad(qD, 'sup'), ...purlinWeight(), ...extraFor('D')];
  for (const q of c.equipos || []) {
    for (const m of geo.rafters) {
      const pos = NX.posOnMember(geo, m, q.x * 1000);
      if (pos == null) continue;
      const loc = NX.locate(mesh, m.id, pos), n = mesh.elems[loc.e];
      D.push({ nodal: true, n: loc.x < 1 ? n.i : n.j, fy: -q.masa * NX.G }); // kg·g = N
      break;
    }
  }
  cases.push({ fam: 'D', id: 'D', name: 'Muerta (cubierta, polines y permanentes)', loads: D });

  // ---- Lr ----
  const qLr = (c.Lr || 0) * kN2;
  const refLr = c.LrRef || 'hor';
  if (qLr > 0 || (c.extra || []).some((x) => x.caso === 'Lr')) {
    cases.push({ fam: 'Lr', id: 'Lr', name: 'Viva de cubierta', loads: [...roofLoad(qLr, refLr), ...extraFor('Lr')] });
    if (c.LrPatrones && geo.rafters.length === 2 && qLr > 0) {
      cases.push({ fam: 'Lr', id: 'Lr-i', name: 'Viva sólo faldón izquierdo', loads: roofLoad(qLr, refLr, (id) => id === 'rafL') });
      cases.push({ fam: 'Lr', id: 'Lr-d', name: 'Viva sólo faldón derecho', loads: roofLoad(qLr, refLr, (id) => id === 'rafR') });
    }
  }
  // ---- S (proyección horizontal) ----
  const qS = (c.S || 0) * kN2;
  if (qS > 0 || (c.extra || []).some((x) => x.caso === 'S')) cases.push({ fam: 'S', id: 'S', name: 'Nieve', loads: [...roofLoad(qS, 'hor'), ...extraFor('S')] });

  // ---- W (ecs. 16–17): presión neta normal a cada superficie ----
  const w = c.viento;
  if (w && w.activo) {
    const qz = NX.windQ(w); // N/mm² (MPa)
    const aw = a;
    const variants = [
      { id: 'W1', dir: 1, cpi: w.cpiPos, name: 'Viento → con presión interior' },
      { id: 'W2', dir: 1, cpi: w.cpiNeg, name: 'Viento → con succión interior' },
      { id: 'W3', dir: -1, cpi: w.cpiPos, name: 'Viento ← con presión interior' },
      { id: 'W4', dir: -1, cpi: w.cpiNeg, name: 'Viento ← con succión interior' },
    ];
    for (const v of variants) {
      const L = [];
      for (const m of geo.members) {
        // normal exterior de la superficie
        let n;
        if (m.kind === 'col') n = m.id === 'colL' ? [-1, 0] : [1, 0];
        else { n = [-m.s, m.c]; if (n[1] < 0) n = [-n[0], -n[1]]; }
        let cpe;
        const windwardWall = v.dir > 0 ? 'colL' : 'colR';
        if (m.kind === 'col') cpe = m.id === windwardWall ? w.cpeBar : w.cpeSot;
        else if (geo.rafters.length === 2) cpe = (v.dir > 0 ? m.id === 'rafL' : m.id === 'rafR') ? w.cpeTechoBar : w.cpeTechoSot;
        else cpe = w.cpeTechoBar;
        const pnet = qz * (cpe - v.cpi); // ec. 17, presión positiva empuja hacia la superficie
        const fx = -pnet * n[0] * aw, fy = -pnet * n[1] * aw;
        if (Math.abs(fx) > 0) L.push(...NX.distOnMember(mesh, m.id, 0, m.L, fx, fx, 'gx'));
        if (Math.abs(fy) > 0) L.push(...NX.distOnMember(mesh, m.id, 0, m.L, fy, fy, 'gy'));
      }
      cases.push({ fam: 'W', id: v.id, name: v.name, loads: L, cpi: v.cpi, qz });
    }
  }
  // normalizar: separar cargas nodales y de barra
  for (const cs of cases) cs.set = NX.toLoadSet(cs.loads);
  return { cases, cover: cv, qD, a };
};

NX.windQ = function (w) {
  // ec. 16: q = ρ V² / 2, con V de diseño en km/h ya afectada por los factores de la norma elegida
  if (w.modo === 'q') return (w.q || 0) * 1e-3; // kN/m² → N/mm²
  const V = (w.V || 0) / 3.6; // m/s
  const rho = 1.225 * (w.G || 1); // kg/m³ (G: corrección por altitud y temperatura)
  return 0.5 * rho * V * V * 1e-6; // Pa → N/mm²
};

NX.toLoadSet = function (loads) {
  const set = { nodal: [], elem: [] };
  for (const l of loads) {
    if (l.nodal) set.nodal.push({ n: l.n, fx: l.fx || 0, fy: l.fy || 0, mz: l.mz || 0 });
    else set.elem.push(l);
  }
  return set;
};

NX.scaleSet = function (set, f) {
  return {
    nodal: set.nodal.map((l) => ({ n: l.n, fx: l.fx * f, fy: l.fy * f, mz: l.mz * f })),
    elem: set.elem.map((l) => (l.type === 'dist' ? { ...l, qa: l.qa * f, qb: (l.qb ?? l.qa) * f }
      : l.type === 'point' ? { ...l, P: l.P * f } : { ...l, M: l.M * f })),
  };
};
NX.mergeSets = function (sets) {
  return { nodal: sets.flatMap((s) => s.nodal), elem: sets.flatMap((s) => s.elem) };
};

// resultante vertical de un conjunto de cargas (para cargas nocionales y sismo)
NX.verticalTotal = function (set, mesh) {
  let Fy = 0;
  for (const l of set.nodal) Fy += l.fy;
  for (const l of set.elem) {
    const el = mesh.elems[l.e];
    const n1 = mesh.nodes[el.i], n2 = mesh.nodes[el.j];
    const L = Math.hypot(n2.x - n1.x, n2.y - n1.y), c = (n2.x - n1.x) / L, s = (n2.y - n1.y) / L;
    if (l.type === 'dist') {
      let f = 1; if (l.proj === 'h') f = Math.abs(c); if (l.proj === 'v') f = Math.abs(s);
      const Q = ((l.qa + (l.qb ?? l.qa)) / 2) * (l.b - l.a) * f;
      if (l.dir === 'gy') Fy += Q; else if (l.dir === 'ly') Fy += Q * c; else if (l.dir === 'lx') Fy += Q * s;
    } else if (l.type === 'point') {
      if (l.dir === 'gy') Fy += l.P; else if (l.dir === 'ly') Fy += l.P * c; else if (l.dir === 'lx') Fy += l.P * s;
    }
  }
  return Fy; // N (negativo hacia abajo)
};

// peso propio del marco por miembro (ec. 12)
NX.selfWeightSet = function (geo, mesh, prof) {
  const L = [];
  for (const m of geo.members) {
    const sec = m.kind === 'col' ? prof.col : prof.beam;
    const w = sec.m * NX.G / 1000; // N/mm
    L.push(...NX.distOnMember(mesh, m.id, 0, m.L, -w, -w, 'gy'));
  }
  return NX.toLoadSet(L);
};

/* ---------- combinaciones (ec. 24) ----------
 * Cada combinación tiene factores por familia {D, Lr, S, W, E}.
 * Se expanden sobre las variantes existentes de cada familia y
 * se eliminan duplicados que resulten idénticos.
 */
NX.expandCombos = function (combos, cases, sismoActivo) {
  const fams = {};
  for (const c of cases) (fams[c.fam] = fams[c.fam] || []).push(c.id);
  if (sismoActivo) fams.E = ['E+', 'E-'];
  const out = [], seen = new Set();
  for (const cb of combos) {
    // la familia variable con mayor factor es la principal; si no existe, la combinación no aplica
    const variable = Object.entries(cb.f).filter(([k, v]) => v && k !== 'D');
    if (variable.length) {
      const principal = variable.reduce((a, b) => (Math.abs(b[1]) > Math.abs(a[1]) ? b : a));
      const tie = variable.filter(([, v]) => Math.abs(v) === Math.abs(principal[1]));
      if (!tie.some(([k]) => fams[k])) continue;
    }
    const active = Object.entries(cb.f).filter(([k, v]) => v && fams[k]);
    // si una combinación pide una familia inexistente con factor ≠ 0, se omite esa familia
    let list = [{ terms: [], label: [] }];
    for (const [fam, fac] of active) {
      const nl = [];
      for (const it of list) for (const id of fams[fam]) nl.push({ terms: [...it.terms, [id, fac]], label: [...it.label, id] });
      list = nl;
    }
    for (const it of list) {
      if (!it.terms.length) continue;
      const sig = cb.tipo + '|' + it.terms.map(([id, f]) => id + '*' + f).sort().join('+');
      if (seen.has(sig)) continue;
      seen.add(sig);
      out.push({ ...cb, terms: it.terms, key: cb.id + (list.length > 1 ? '·' + it.label.filter((l) => l !== 'D').join(',') : '') });
    }
  }
  return out;
};

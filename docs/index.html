/* ============================================================
 * Placa base y anclas — revisión preliminar (Guía cap. 12)
 * Apoyo y espesor: AISC Design Guide 1 (3a ed.) y AISC J8.
 * Anclas: ACI 318-19 cap. 17 (anclas preinstaladas con cabeza, condición B).
 * Unidades N, mm, MPa.
 * ============================================================ */

// área efectiva a tensión de anclas (in² → mm²) por diámetro nominal en pulgadas
NX.ANCHOR_ASE = { 12.7: 91.6, 15.875: 146, 19.05: 215, 22.225: 298, 25.4: 391, 31.75: 625, 38.1: 906, 44.45: 1226, 50.8: 1613 };
NX.ANCHOR_SIZES = [[12.7, '1/2"'], [15.875, '5/8"'], [19.05, '3/4"'], [22.225, '7/8"'], [25.4, '1"'], [31.75, '1 1/4"'], [38.1, '1 1/2"'], [44.45, '1 3/4"'], [50.8, '2"']];

NX.basePlate = function (p, col, reacts, method) {
  const b = p.base, fc = b.fc, Fyp = b.placa.Fy;
  const B = b.placa.B, N = b.placa.N, tp = b.placa.t;
  const A1 = B * N, A2 = Math.max(A1, b.ped.B * b.ped.N);
  const kind = NX.FAMILY_KIND[col.fam];
  const d = col.d || col.D, bf = kind === 'I' ? col.bf : kind === 'HSSR' ? col.B : col.D;
  const issues = [];
  if (B < bf + 20 || N < d + 20) issues.push('La placa debe exceder la huella de la columna (se sugieren al menos 10 mm por lado).');
  if (b.ped.B < B || b.ped.N < N) issues.push('El pedestal es menor que la placa.');
  // apoyo en concreto (ec. 76, AISC J8): fp,max = 0.85 f'c √(A2/A1) ≤ 1.7 f'c
  const ratio = Math.min(2, Math.sqrt(A2 / A1));
  const fpn = Math.min(0.85 * fc * ratio, 1.7 * fc);
  const fpmax = method === 'ASD' ? fpn / 2.31 : 0.65 * fpn;
  const qmax = fpmax * B;
  // geometría para espesor (DG1)
  let m, n, lamn = 0;
  if (kind === 'I') { m = (N - 0.95 * d) / 2; n = (B - 0.8 * bf) / 2; lamn = Math.sqrt(d * bf) / 4; }
  else if (kind === 'HSSR') { m = (N - 0.95 * d) / 2; n = (B - 0.95 * bf) / 2; }
  else { m = n = (N - 0.8 * d) / 2; }
  const f = b.anclas.sy / 2; // distancia del centro de la placa a la línea de anclas
  const cBear = method === 'ASD' ? 1.83 : 1.5, cBearY = method === 'ASD' ? 2.58 : 2.11, cTen = method === 'ASD' ? 2.58 : 2.11;
  const rows = reacts.map((r) => {
    const P = r.P, M = Math.abs(r.M), V = Math.abs(r.V);
    const o = { combo: r.combo, base: r.base, P, M, V };
    if (P > 0 && M < 1e-6 * Math.max(1, P * N)) {
      o.caso = 'compresión concéntrica';
      o.fp = P / A1; o.Y = N; o.T = 0;
      o.etaBear = o.fp / fpmax;
      const l = Math.max(m, n, lamn);
      o.tReq = l * Math.sqrt(2 * P / ((method === 'ASD' ? 1 / 1.67 : 0.9) * Fyp * B * N));
      o.q1 = o.q2 = P / A1;
    } else if (P > 0) {
      const e = M / P, ecrit = N / 2 - P / (2 * qmax);
      o.e = e; o.ecrit = ecrit;
      o.q1 = P / A1 * (1 + 6 * e / N); o.q2 = P / A1 * (1 - 6 * e / N); // ec. 78 (referencia elástica)
      if (e <= ecrit) {
        o.caso = 'momento pequeño (sin tensión en anclas)';
        o.Y = N - 2 * e; o.fp = P / (o.Y * B); o.T = 0; o.etaBear = o.fp / fpmax;
      } else {
        const k = f + N / 2, disc = k * k - 2 * P * (e + f) / qmax;
        if (disc < 0) {
          o.caso = 'momento grande: la placa no alcanza el equilibrio';
          o.fail = 'La combinación P–M excede la capacidad de apoyo de la placa: aumentar N o B.';
          o.etaBear = Infinity; o.T = NaN; o.Y = NaN; o.fp = fpmax;
        } else {
          o.caso = 'momento grande (tensión en anclas)';
          o.Y = k - Math.sqrt(disc); o.T = qmax * o.Y - P; o.fp = fpmax; o.etaBear = (P + o.T) / (qmax * o.Y);
        }
      }
      if (Number.isFinite(o.Y)) {
        o.tReq = o.Y >= m ? cBear * m * Math.sqrt(o.fp / Fyp) : cBearY * Math.sqrt(o.fp * o.Y * (m - o.Y / 2) / Fyp);
      }
    } else {
      // levantamiento: tensión directa (y par si hay momento)
      o.caso = M > 0 ? 'levantamiento con momento' : 'levantamiento';
      const Tup = -P;
      o.T = M > 0 ? Tup / 2 + M / (2 * f) : Tup; // por fila de anclas en tensión
      o.Tgroup = M > 0 ? null : Tup;
      o.etaBear = 0; o.fp = 0; o.tReq = 0;
    }
    if (o.T > 0) {
      const tf = kind === 'I' ? col.tf : (col.t || 6);
      const x = Math.max(1, f - d / 2 + tf / 2);
      o.tReqT = cTen * Math.sqrt(o.T * x / (B * Fyp));
      o.tReq = Math.max(o.tReq || 0, o.tReqT);
      o.xT = x;
    }
    o.etaPlate = o.tReq / tp;
    return o;
  });
  return { A1, A2, ratio, fpmax, qmax, m, n, lamn, f, rows, issues };
};

NX.anchors = function (p, rows) {
  const a = p.base.anclas, fc = p.base.fc, ped = p.base.ped;
  const da = a.d, Ase = NX.ANCHOR_ASE[da] || 0.7854 * Math.pow(da - 0.9743 * 25.4 / NX.tpi(da), 2);
  const futa = Math.min(a.futa, 1.9 * a.fya, 860);
  const nRow = Math.max(1, Math.round(a.n / 2));
  const lam = 1.0;
  // geometría del grupo
  const ca = a.borde;
  let hef = a.hef;
  const sMax = Math.max(a.sx, a.sy);
  let hefNote = '';
  // 17.6.2.1.2: con tres o más bordes a menos de 1.5hef, se usa h'ef
  if (ca < 1.5 * hef) {
    const hp = Math.max(ca / 1.5, sMax / 3);
    if (hp < hef) { hefNote = `h'ef = max(ca,máx/1.5, s/3) = ${hp.toFixed(0)} mm (17.6.2.1.2)`; hef = hp; }
  }
  const c15 = 1.5 * hef;
  const Nb = (hef >= 280 && hef <= 635 ? 3.9 * lam * Math.sqrt(fc) * Math.pow(hef, 5 / 3) : 10 * lam * Math.sqrt(fc) * Math.pow(hef, 1.5));
  const ANco = 9 * hef * hef;
  const psiEd = ca >= c15 ? 1 : 0.7 + 0.3 * ca / c15;
  const psiC = a.fisurado ? 1.0 : 1.25;
  const sx = Math.min(a.sx, 3 * hef), sy = Math.min(a.sy, 3 * hef);
  const ce = Math.min(ca, c15);
  // fila en tensión (momento) y grupo completo (levantamiento)
  const ANcRow = (2 * ce + (nRow - 1) * sx) * (ce + Math.min(c15, a.sy));
  const ANcAll = (2 * ce + (nRow - 1) * sx) * (2 * ce + sy);
  const NcbRow = Math.min(ANcRow, nRow * ANco) / ANco * psiEd * psiC * Nb;
  const NcbAll = Math.min(ANcAll, a.n * ANco) / ANco * psiEd * psiC * Nb;
  const F = 1.5 * da + 3.175; // tuerca hexagonal pesada, entre caras
  const Abrg = 0.866 * F * F - Math.PI * da * da / 4;
  const Np = 8 * Abrg * fc * (a.fisurado ? 1.0 : 1.4);
  const Nsa = Ase * futa;
  const Nsb = a.hef > 2.5 * ca ? 13 * ca * Math.sqrt(Abrg) * lam * Math.sqrt(fc) : Infinity;
  // cortante
  const Vsa = 0.6 * Ase * futa * 0.8; // 0.8 por placa con mortero de nivelación (17.7.1.2.1)
  const ca1 = ca, le = Math.min(a.hef, 8 * da);
  const Vb = Math.min(0.6 * Math.pow(le / da, 0.2) * Math.sqrt(da) * lam * Math.sqrt(fc) * Math.pow(ca1, 1.5), 3.7 * lam * Math.sqrt(fc) * Math.pow(ca1, 1.5));
  const AVco = 4.5 * ca1 * ca1;
  const c2 = ca;
  const AVc = (Math.min(1.5 * ca1, c2) * 2 + (nRow - 1) * Math.min(a.sx, 3 * ca1)) * Math.min(1.5 * ca1, ped.h);
  const psiEdV = c2 >= 1.5 * ca1 ? 1 : 0.7 + 0.3 * c2 / (1.5 * ca1);
  const psiCV = a.fisurado ? 1.0 : 1.4;
  const psiHV = Math.max(1, Math.sqrt(1.5 * ca1 / ped.h));
  const Vcbg = Math.min(AVc, nRow * AVco) / AVco * psiEdV * psiCV * psiHV * Vb;
  const Vcpg = (a.hef >= 65 ? 2 : 1) * NcbAll;
  const phi = { sa: 0.75, sv: 0.65, cb: 0.70, pn: 0.70, sb: 0.70, cbV: 0.70, cp: 0.70 };
  const caps = {
    Ase, futa, hef, hefNote, Nb, ANco, ANcRow, ANcAll, psiEd, psiC, NcbRow, NcbAll, Abrg, Np, Nsa, Nsb, Vsa, Vb, AVc, AVco, psiEdV, psiCV, psiHV, Vcbg, Vcpg, phi,
  };
  const out = rows.map((r) => {
    const o = { combo: r.combo, base: r.base };
    const T = Math.max(0, r.T || 0);
    const allTension = r.P <= 0 && !(r.M > 0);
    const nT = allTension ? a.n : nRow;
    const Tgroup = allTension ? (r.Tgroup || T) : T;
    const Nua = Tgroup / nT;
    const Ncb = allTension ? NcbAll : NcbRow;
    const modesN = [
      ['acero (17.6.1)', phi.sa * Nsa, Nua],
      ['arrancamiento del concreto (17.6.2)', phi.cb * Ncb, Tgroup],
      ['extracción (17.6.3)', phi.pn * Np, Nua],
    ];
    if (Number.isFinite(Nsb)) modesN.push(['desprendimiento lateral (17.6.4)', phi.sb * Nsb, Nua]);
    // cortante: por anclas o por fricción (Guía ec. 93)
    const Vu = r.V;
    const C = Math.max(0, r.P + T);
    let modesV = [], fric = null;
    if (p.base.cortante === 'friccion') {
      fric = { cap: 0.75 * p.base.mu * C, Vu };
    } else {
      modesV = [
        ['acero (17.7.1)', phi.sv * Vsa, Vu / a.n],
        ['arrancamiento hacia el borde (17.7.2)', phi.cbV * Vcbg, Vu],
        ['desprendimiento por palanca (17.7.3)', phi.cp * Vcpg, Vu],
      ];
    }
    const etaN = Math.max(0, ...modesN.map(([, c, d]) => (d > 0 ? d / c : 0)));
    const etaV = modesV.length ? Math.max(0, ...modesV.map(([, c, d]) => (d > 0 ? d / c : 0))) : 0;
    let etaNV;
    if (etaV <= 0.2) etaNV = etaN; else if (etaN <= 0.2) etaNV = etaV; else etaNV = (etaN + etaV) / 1.2;
    Object.assign(o, { T: Tgroup, Nua, Vu, modesN, modesV, fric, etaN, etaV, etaNV, etaFric: fric ? (fric.cap > 0 ? Vu / fric.cap : (Vu > 0 ? Infinity : 0)) : 0 });
    return o;
  });
  return { caps, rows: out };
};
NX.tpi = (d) => (d <= 12.7 ? 13 : d <= 15.875 ? 11 : d <= 19.05 ? 10 : d <= 22.225 ? 9 : d <= 25.4 ? 8 : 7);

// reacciones simultáneas en bases para una lista de combinaciones de una alternativa analizada
NX.baseReactions = function (prep, alt, combos) {
  const direct = prep.p.diseno.analisis === 'directo';
  const nL = prep.mesh.nodeOf(prep.geo.pts.baseL), nR = prep.mesh.nodeOf(prep.geo.pts.baseR);
  const nEL = prep.mesh.nodeOf(prep.geo.pts.eaveL), nER = prep.mesh.nodeOf(prep.geo.pts.eaveR);
  const out = [];
  for (const combo of combos) {
    let res;
    if (direct) {
      const alpha = combo.tipo === 'ASD' ? 1.6 : 1;
      const set = NX.comboSet(combo, alt.sets, alpha);
      const Y = -NX.verticalTotal(set, prep.mesh);
      const sway = combo.terms.reduce((s, [id, f]) => s + (alt.caseRes[id] ? f * (alt.caseRes[id].D[3 * nEL] + alt.caseRes[id].D[3 * nER]) : 0), 0);
      const Hn = 0.003 * Y * (sway >= 0 ? 1 : -1);
      set.nodal.push({ n: nEL, fx: Hn / 2, fy: 0, mz: 0 }, { n: nER, fx: Hn / 2, fy: 0, mz: 0 });
      res = NX.analyze(alt.model, set, { secondOrder: true, stiffFactor: { EA: 0.8, EI: 0.8 } });
      if (!res.ok) continue;
      if (alpha !== 1) res = NX.scaleResult(res, 1 / alpha);
    } else res = NX.superpose(alt.caseRes, combo.terms);
    for (const [n, name] of [[nL, 'izquierda'], [nR, 'derecha']]) {
      const r = res.reactions.find((x) => x.n === n);
      out.push({ combo: combo.nombre, key: combo.key, base: name, P: r.fy, V: r.fx, M: r.mz });
    }
  }
  return out;
};

// ---- evaluate.js
/* ============================================================
 * Evaluación de alternativas (Guía cap. 9) y análisis detallado
 * ============================================================ */

NX.STATUS = {
  cumple: 'Cumple las comprobaciones indicadas',
  falla: 'No cumple',
  insuficiente: 'Información insuficiente',
  alcance: 'Fuera del alcance',
  inestable: 'Modelo inestable',
  pendiente: 'Pendiente de revisión',
};

NX.materialFor = function (p, sec) {
  const m = p.materiales;
  const kind = NX.FAMILY_KIND[sec.fam];
  const Fy = kind === 'HSSR' ? m.FyHSSR : kind === 'HSSC' ? m.FyHSSC : m.FyI;
  return { E: m.E, G: m.G, Fy, Fu: m.Fu };
};

// preparación independiente de los perfiles
NX.prepare = function (p) {
  const geo = NX.geometry(p);
  if (geo.errors.length) return { errors: geo.errors };
  const purl = NX.purlinLayout(geo, p);
  const share = NX.frameShare(p);
  const mesh = NX.buildMesh(geo, p, purl);
  const lc = NX.buildCases(p, geo, mesh, purl, share);
  const method = p.diseno.metodo;
  const sismo = !!(p.cargas.sismo && p.cargas.sismo.activo);
  const strength = NX.expandCombos(p.diseno.combos[method].map((c) => ({ ...c, tipo: method })), lc.cases, sismo);
  const lrfd = method === 'LRFD' ? strength : NX.expandCombos(p.diseno.combos.LRFD.map((c) => ({ ...c, tipo: 'LRFD' })), lc.cases, sismo);
  const serv = NX.expandCombos(p.diseno.combos.SERV.map((c) => ({ ...c, tipo: 'SERV' })), lc.cases, sismo);
  // marcos de arriostramiento (posiciones a lo largo de cada miembro)
  const brace = {};
  for (const m of geo.members) {
    if (m.kind === 'col') {
      const Ly = (p.estructura.LyCol > 0 ? p.estructura.LyCol * 1000 : m.L);
      brace[m.id] = { top: NX.gridPositions(m.L, Ly), bot: NX.gridPositions(m.L, Ly), Ly };
    } else {
      const sup = purl.lines.filter((l) => l.member === m.id).map((l) => l.pos).sort((a, b) => a - b);
      const LbInf = p.estructura.LbInf > 0 ? p.estructura.LbInf * 1000 : m.L;
      brace[m.id] = { top: sup.length > 1 ? sup : [0, m.L], bot: NX.gridPositions(m.L, LbInf), Ly: Math.min(LbInf, m.L) };
    }
  }
  return { p, geo, purl, share, mesh, lc, strength, lrfd, serv, brace, method, sismo, errors: [] };
};

NX.gridPositions = function (L, step) {
  const n = Math.max(1, Math.ceil(L / step - 1e-9));
  return Array.from({ length: n + 1 }, (_, k) => (L * k) / n);
};

NX.sectionFromRow = function (fam, row, fields) {
  const s = { fam };
  fields.forEach((k, i) => (s[k] = row[i]));
  s.id = fam + '|' + s.des;
  return s;
};

// modelo estructural para un par de perfiles
NX.frameModel = function (prep, prof) {
  const { mesh } = prep;
  const E = prep.p.materiales.E;
  const elems = mesh.elems.map((el) => {
    const kind = el.member.startsWith('col') ? 'col' : 'beam';
    const sec = kind === 'col' ? prof.col : prof.beam;
    return { i: el.i, j: el.j, E, A: sec.A, I: sec.Ix, member: el.member, s0: el.s0, s1: el.s1 };
  });
  return { nodes: mesh.nodes, elems, restr: mesh.restr };
};

// conjuntos de carga por variante (incluye peso propio y sismo)
NX.caseSets = function (prep, prof) {
  const sw = NX.selfWeightSet(prep.geo, prep.mesh, prof);
  const sets = {};
  for (const c of prep.lc.cases) sets[c.id] = c.fam === 'D' ? NX.mergeSets([c.set, sw]) : c.set;
  const WD = -NX.verticalTotal(sets.D, prep.mesh);
  let Fs = 0;
  if (prep.sismo) {
    const s = prep.p.cargas.sismo;
    const WLr = sets.Lr ? -NX.verticalTotal(sets.Lr, prep.mesh) : 0;
    Fs = s.Cs * (WD + (s.fraccionLr || 0) * WLr);
    const nL = prep.mesh.nodeOf(prep.geo.pts.eaveL), nR = prep.mesh.nodeOf(prep.geo.pts.eaveR);
    sets['E+'] = { nodal: [{ n: nL, fx: Fs / 2, fy: 0, mz: 0 }, { n: nR, fx: Fs / 2, fy: 0, mz: 0 }], elem: [] };
    sets['E-'] = { nodal: [{ n: nL, fx: -Fs / 2, fy: 0, mz: 0 }, { n: nR, fx: -Fs / 2, fy: 0, mz: 0 }], elem: [] };
  }
  return { sets, WD, Fs };
};

NX.comboSet = function (combo, sets, mult = 1) {
  return NX.mergeSets(combo.terms.filter(([id]) => sets[id]).map(([id, f]) => NX.scaleSet(sets[id], f * mult)));
};

// arreglos de esfuerzos a lo largo de cada miembro físico
NX.memberDiagrams = function (prep, res, stationsPerElem = 2) {
  const out = {};
  const model = prep.mesh;
  for (const m of prep.geo.members) {
    const st = [];
    for (const e of model.segs[m.id]) {
      const mem = res.members[e], el = model.elems[e];
      const xs = NX.stations(mem, stationsPerElem);
      for (const x of xs) {
        const f = NX.internalAt(mem, x);
        st.push({ s: el.s0 + x, N: f.N, V: f.V, M: f.M });
      }
    }
    out[m.id] = st;
  }
  return out;
};

// interpolación de |M| en una posición
NX.interpM = function (st, s) {
  for (let k = 1; k < st.length; k++) {
    if (st[k].s >= s) {
      const a = st[k - 1], b = st[k], d = b.s - a.s;
      return d > 0 ? a.M + (b.M - a.M) * (s - a.s) / d : b.M;
    }
  }
  return st[st.length - 1].M;
};

/* ---------- comprobación de un miembro en una combinación ---------- */
NX.checkMember = function (prep, m, sec, mat, st, method, Kx, detail) {
  const br = prep.brace[m.id];
  const Lcx = Kx * m.L;
  const Lcy = Math.min(br.Ly, m.L);
  const comp = NX.compression(sec, mat, Lcx, Lcy, Lcy);
  if (!comp.scope) return { scope: false, why: comp.why };
  const Pc = NX.available(comp.Pn, NX.FACT.comp, method);
  const Pt = NX.available(mat.Fy * sec.A, NX.FACT.tens, method);
  const sh = NX.shear(sec, mat, m.L / 2);
  if (!sh.scope) return { scope: false, why: sh.why };
  const Vc = NX.available(sh.Vn, sh.f, method);
  // segmentos no arriostrados por signo de momento
  const segCache = new Map();
  const segFor = (s, positive) => {
    const grid = (m.kind === 'col' || positive) ? br.top : br.bot;
    let k = 0; while (k < grid.length - 2 && s > grid[k + 1] + 1e-6) k++;
    const key = (positive ? 'p' : 'n') + k;
    if (segCache.has(key)) return segCache.get(key);
    const a = grid[k], b = grid[k + 1], Lb = b - a;
    const inSeg = st.filter((x) => x.s >= a - 1e-6 && x.s <= b + 1e-6);
    const Mmax = Math.max(...inSeg.map((x) => Math.abs(x.M)));
    const Cb = NX.Cb(Mmax, Math.abs(NX.interpM(st, a + Lb / 4)), Math.abs(NX.interpM(st, a + Lb / 2)), Math.abs(NX.interpM(st, a + 3 * Lb / 4)));
    const fl = NX.flexure(sec, mat, Lb, Cb);
    const v = { a, b, Lb, Cb, fl, Mc: fl.scope ? NX.available(fl.Mn, NX.FACT.flex, method) : 0 };
    segCache.set(key, v);
    return v;
  };
  let worst = { eta: -1 }, worstV = { eta: -1 };
  for (const x of st) {
    const seg = segFor(x.s, x.M >= 0);
    if (!seg.fl.scope) return { scope: false, why: seg.fl.why };
    const Pcap = x.N < 0 ? Pc : Pt;
    const it = NX.interaction(x.N, Pcap, x.M, seg.Mc);
    if (it.eta > worst.eta) worst = { ...it, s: x.s, N: x.N, M: x.M, V: x.V, Pcap, Mc: seg.Mc, seg, compression: x.N < 0 };
    const ev = Math.abs(x.V) / Vc;
    if (ev > worstV.eta) worstV = { eta: ev, s: x.s, V: x.V };
  }
  const r = { scope: true, eta: Math.max(worst.eta, worstV.eta), inter: worst, shear: worstV, Pc, Pt, Vc, comp, sh, Lcx, Lcy, Kx };
  r.gov = worstV.eta > worst.eta ? 'cortante' : NX.describeGov(worst);
  if (detail) r.segments = [...segCache.values()];
  return r;
};

NX.describeGov = function (w) {
  if (w.p >= 0.2 || w.m < 0.05) {
    if (w.m < 0.05) return w.compression ? 'compresión axial' : 'tensión axial';
    return 'flexocompresión (H1-1a)';
  }
  const fl = w.seg.fl;
  return 'flexión: ' + (fl.gov || '') + (w.eq === 'H1-1b' && w.p > 0.02 ? ' + axial (H1-1b)' : '');
};

/* ---------- longitud efectiva por nomograma (sólo para primer orden) ----------
 * Fórmula de Dumonteil (marco no arriostrado): K = √((1.6GAGB + 4(GA+GB) + 7.5)/(GA+GB+7.5)) */
NX.Ksway = function (prep, prof) {

  clearTimeout(tUpd);
  tUpd = setTimeout(() => { recompute(); if (structural) renderStep(); else refreshDerived(); drawVisual(); saveCurrent(); }, 120);
}
function recompute() {
  try {
    // sincronizar masa del polín con el catálogo
    const pol = S.p.polines, ps = secOf(pol.familia, pol.perfil);
    if (ps) pol.masa = ps.m;
    S.prep = NX.prepare(S.p);
    S.prepErr = S.prep.errors.length ? S.prep.errors.join(' ') : null;
    if (S.prepErr) S.prep = null;
  } catch (e) { S.prep = null; S.prepErr = e.message; console.error(e); }
}

// perfiles actuales para dibujo y análisis
function currentProf() {
  const b = secById(S.p.seleccion.beam) || secOf('IR', '356 x 44.7');
  const c = secById(S.p.seleccion.col) || secOf('IR', '356 x 44.7');
  return { beam: b, col: c };
}

// ---------- análisis detallado de la alternativa seleccionada ----------
function runDetail() {
  if (!S.prep) recompute();
  if (!S.prep) { S.altErr = S.prepErr; return null; }
  try {
    const prof = currentProf();
    S.alt = NX.runAlternative(S.prep, prof, { detail: true, rigorous: true });
    S.altErr = null;
    if (S.comboIdx >= (S.alt.results || []).length) S.comboIdx = 0;
  } catch (e) { S.alt = null; S.altErr = e.message; console.error(e); }
  return S.alt;
}

// ---------- enlace de entradas ----------
function bind(root) {
  $$('[data-k]', root).forEach((el) => {
    const path = el.dataset.k, t = el.dataset.t || 'num';
    const v = getPath(S.p, path);
    if (el.type === 'checkbox') el.checked = !!v;
    else if (document.activeElement !== el) el.value = v ?? '';
    el.addEventListener(el.tagName === 'SELECT' || el.type === 'checkbox' ? 'change' : 'input', () => {
      let val;
      if (el.type === 'checkbox') val = el.checked;
      else if (t === 'num') { val = parseFloat(String(el.value).replace(',', '.')); if (!Number.isFinite(val)) return; }
      else val = el.value;
      setPath(S.p, path, val);
      if (el.dataset.after) AFTER[el.dataset.after]?.();
      touch(el.dataset.s === '1', path);
    });
  });
  $$('[data-set]', root).forEach((el) => {
    el.addEventListener('click', () => {
      const [path, raw] = el.dataset.set.split('=');
      const val = raw === 'true' ? true : raw === 'false' ? false : (Number.isFinite(+raw) && raw !== '' ? +raw : raw);
      setPath(S.p, path, val);
      if (el.dataset.after) AFTER[el.dataset.after]?.();
      touch(true, path);
    });
  });
}
const AFTER = {
  calibre() {
    const t = { 22: 0.76, 24: 0.61, 26: 0.46, 28: 0.38 }[S.p.cubierta.lamina.calibre];

    if (s !== 'LOSACERO' && S.p.polines.familia === 'IR') { S.p.polines.familia = 'CF'; S.p.polines.perfil = '254 x 14'; S.p.polines.sepMax = 1.5; }
  },
  metodo() { S.evalRes = null; },
};

// ---- draw.js
/* ============ Nodex · dibujo del marco (frontal, lateral, 3D), placa y secciones ============ */
const VW = 800, VH = 600;

function frameFit(geo, pad) {
  const xs = [0, geo.B], ys = [0, geo.hMax];
  const w = xs[1] - xs[0], h = ys[1] - ys[0];
  const sc = Math.min((VW - pad.l - pad.r) / w, (VH - pad.t - pad.b) / h);
  const ox = pad.l + ((VW - pad.l - pad.r) - w * sc) / 2;
  const oy = VH - pad.b - ((VH - pad.t - pad.b) - h * sc) / 2;
  return { sc, X: (x) => ox + x * sc, Y: (y) => oy - y * sc };
}
const P = (x, y) => `${x.toFixed(1)},${y.toFixed(1)}`;

function arrowHead(x1, y1, x2, y2, size = 7) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  const p1 = [x2 - size * Math.cos(a - 0.4), y2 - size * Math.sin(a - 0.4)];
  const p2 = [x2 - size * Math.cos(a + 0.4), y2 - size * Math.sin(a + 0.4)];
  return `${P(x2, y2)} ${P(p1[0], p1[1])} ${P(p2[0], p2[1])}`;
}
function dimLine(x1, y1, x2, y2, label, off = 0, vertical = false) {
  // cota con líneas de referencia y flechas
  const t = 4;
  let s = `<line class="d-dim" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  s += `<polygon class="d-dim" style="fill:var(--ink-2)" points="${arrowHead(x2, y2, x1, y1, 6)}"/><polygon class="d-dim" style="fill:var(--ink-2)" points="${arrowHead(x1, y1, x2, y2, 6)}"/>`;
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  if (vertical) s += `<text class="d-dimtxt" x="${mx + 8 + off}" y="${my + 4}" ${off < 0 ? 'text-anchor="end"' : ''}>${label}</text>`;
  else s += `<text class="d-dimtxt" x="${mx}" y="${my + 18}" text-anchor="middle">${label}</text>`;
  void t;
  return s;
}

function memberPoly(T, m, depth) {
  const h = Math.max(4, Math.min(22, depth * T.sc)) / 2;
  const ax = T.X(m.a.x), ay = T.Y(m.a.y), bx = T.X(m.b.x), by = T.Y(m.b.y);
  const L = Math.hypot(bx - ax, by - ay), nx = -(by - ay) / L * h, ny = (bx - ax) / L * h;
  return `<polygon class="d-member-fill" points="${P(ax + nx, ay + ny)} ${P(bx + nx, by + ny)} ${P(bx - nx, by - ny)} ${P(ax - nx, ay - ny)}"/>`;
}

function supportSym(x, y, fixed) {
  if (fixed) {
    let s = `<line class="d-support" x1="${x - 16}" y1="${y}" x2="${x + 16}" y2="${y}"/>`;
    for (let i = -14; i <= 14; i += 6) s += `<line class="d-hatch" x1="${x + i}" y1="${y}" x2="${x + i - 6}" y2="${y + 8}"/>`;
    return s;
  }
  let s = `<polygon class="d-support" points="${P(x, y)} ${P(x - 11, y + 16)} ${P(x + 11, y + 16)}"/><line class="d-support" x1="${x - 16}" y1="${y + 16}" x2="${x + 16}" y2="${y + 16}"/>`;
  for (let i = -14; i <= 14; i += 6) s += `<line class="d-hatch" x1="${x + i}" y1="${y + 16}" x2="${x + i - 6}" y2="${y + 23}"/>`;
  return s;
}

function frontSVG(mode) {
  const prep = S.prep;
  if (!prep) return `<svg viewBox="0 0 ${VW} ${VH}"><text x="${VW / 2}" y="${VH / 2}" text-anchor="middle" class="d-dimtxt">${esc(S.prepErr || 'Datos incompletos')}</text></svg>`;
  const geo = prep.geo;
  const T = frameFit(geo, { l: 120, r: 120, t: mode === 'loads' ? 120 : 80, b: 90 });
  const prof = currentProf();
  let s = '';
  // diagrama (detrás de los miembros)
  let legend = '';
  if (mode === 'diag' && S.alt && S.alt.results) {
    const r = S.alt.results[Math.min(S.comboIdx, S.alt.results.length - 1)];
    if (S.diag === 'D') { s += deformedSVG(T, r); legend = 'Deformada amplificada'; }
    else if (S.diag === 'R') { legend = 'Reacciones'; }
    else { const o = diagramSVG(T, r, S.diag); s += o.svg; legend = o.legend; }
  }
  for (const mb of geo.members) s += memberPoly(T, mb, mb.kind === 'col' ? prof.col.d || 350 : prof.beam.d || 350);
  // polines
  for (const l of prep.purl.lines) {
    const mb = geo.members.find((x) => x.id === l.member);
    const x = mb.a.x + mb.c * l.pos, y = mb.a.y + mb.s * l.pos;
    const h = Math.max(4, Math.min(22, (prof.beam.d || 350) * T.sc)) / 2;
    const px = T.X(x) - mb.s * (h + 4) * 1, py = T.Y(y) - mb.c * (h + 4);
    s += `<rect class="d-purlin" x="${(px - 3).toFixed(1)}" y="${(py - 4).toFixed(1)}" width="6" height="8" rx="1" transform="rotate(${(-Math.atan2(mb.dy, mb.dx) * 180 / Math.PI).toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)})"/>`;
  }
  const fixed = S.p.estructura.apoyo === 'empotrado';
  s += supportSym(T.X(0), T.Y(0), fixed) + supportSym(T.X(geo.B), T.Y(0), fixed);
  if (mode === 'loads') s += loadsSVG(T, S.loadCase);
  if (mode === 'diag' && S.alt && S.alt.results && S.diag === 'R') s += reactionsSVG(T, S.alt.results[Math.min(S.comboIdx, S.alt.results.length - 1)]);
  // cotas
  if (S.cotas || mode === 'geom') {
    const yb = T.Y(0) + (mode === 'loads' ? 46 : 52);
    s += `<line class="d-grid" x1="${T.X(0)}" y1="${T.Y(0) + 26}" x2="${T.X(0)}" y2="${yb + 6}"/><line class="d-grid" x1="${T.X(geo.B)}" y1="${T.Y(0) + 26}" x2="${T.X(geo.B)}" y2="${yb + 6}"/>`;
    s += dimLine(T.X(0), yb, T.X(geo.B), yb, `${m(geo.B)} m`);
    const xl = T.X(0) - 44;
    s += dimLine(xl, T.Y(0), xl, T.Y(geo.H), `${m(geo.H)} m`, -16, true);
    const xr = T.X(geo.B) + 44;
    const top = geo.pts.ridge ? geo.pts.ridge.y : geo.H2;
    if (geo.pts.ridge || geo.H2 !== geo.H) {
      s += dimLine(xr, T.Y(0), xr, T.Y(top), `${m(top)} m`, 4, true);
      s += `<line class="d-grid" stroke-dasharray="4 4" x1="${T.X(geo.pts.ridge ? geo.pts.ridge.x : geo.B)}" y1="${T.Y(top)}" x2="${xr + 6}" y2="${T.Y(top)}"/>`;
    }
    const r0 = geo.rafters[0];
    const tx = T.X((r0.a.x + r0.b.x) / 2), ty = T.Y((r0.a.y + r0.b.y) / 2) - 26;
    if (geo.pendiente > 0.01) s += `<text class="d-txt mono" x="${tx}" y="${ty}" text-anchor="middle">i = ${fmt(geo.pendiente, 1)} % · θ = ${fmt(geo.theta * 180 / Math.PI, 2)}°</text>`;
    if (S.cotas && mode !== 'loads') {
      s += `<text class="d-txt mono" x="${tx}" y="${ty + 52}" text-anchor="middle">ℓ = ${m(r0.L)} m · ${prep.purl.lines.filter((l) => l.member === r0.id).length} polines @ ${m(prep.purl.spacing[0])} m</text>`;
    }
  }
  return `<svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Vista frontal del marco">${s}</svg>` + (legend ? `<!--${legend}-->` : '');
}

function loadsSVG(T, caseId) {
  const prep = S.prep;
  const cs = prep.lc.cases.find((c) => c.id === caseId);
  let s = '';
  if (!cs) {
    if (caseId === 'E+') return `<text class="d-loadtxt" x="${VW / 2}" y="40" text-anchor="middle">La fuerza sísmica depende del peso de cada alternativa; se muestra en Análisis.</text>`;
    return '';
  }
  // incluir peso propio del marco en D (con los perfiles actuales)
  let set = cs.set;
  if (cs.fam === 'D') set = NX.mergeSets([set, NX.selfWeightSet(prep.geo, prep.mesh, currentProf())]);
  const mesh = prep.mesh;
  const nodal = set.nodal.filter((l) => Math.abs(l.fx) + Math.abs(l.fy) > 1e-9);
  const maxN = Math.max(1e-9, ...nodal.map((l) => Math.hypot(l.fx, l.fy)));
  for (const l of nodal) {
    const nd = mesh.nodes[l.n];
    const mag = Math.hypot(l.fx, l.fy), len = 22 + 34 * mag / maxN;
    const ux = l.fx / mag, uy = -l.fy / mag; // pantalla
    const x2 = T.X(nd.x), y2 = T.Y(nd.y) - (uy > 0 ? 14 : -14) * 0;
    const x1 = x2 - ux * len, y1 = y2 - uy * len;
    s += `<line class="d-load" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="1.6"/><polygon class="d-load" points="${arrowHead(x1, y1, x2, y2)}"/>`;
  }
  if (nodal.length) {
    const tot = nodal.reduce((a, l) => a + l.fy, 0);
    const pmax = nodal.reduce((a, l) => (Math.abs(l.fy) > Math.abs(a) ? l.fy : a), 0);
    s += `<text class="d-loadtxt" x="${VW / 2}" y="28" text-anchor="middle">Reacciones de polines: máx ${kN(Math.abs(pmax))} kN · Σ ${kN(Math.abs(tot))} kN</text>`;
  }
  // distribuidas: flechas por sub-elemento
  const dist = set.elem.filter((l) => l.type === 'dist');
  const comp = dist.map((l) => {
    const el = mesh.elems[l.e], a = mesh.nodes[el.i], b = mesh.nodes[el.j];
    const L = Math.hypot(b.x - a.x, b.y - a.y), c = (b.x - a.x) / L, sn = (b.y - a.y) / L;
    const f = l.proj === 'h' ? Math.abs(c) : 1;
    const q = (l.qa + (l.qb ?? l.qa)) / 2 * f;
    const g = l.dir === 'gx' ? [q, 0] : l.dir === 'gy' ? [0, q] : l.dir === 'ly' ? [-sn * q, c * q] : [c * q, sn * q];
    const t0 = l.a / L, t1 = l.b / L, tm = (t0 + t1) / 2;
    return { x: a.x + (b.x - a.x) * tm, y: a.y + (b.y - a.y) * tm, g, member: el.member };
  });
  // agrupar por punto (suma de componentes gx y gy)
  const byPt = new Map();
  for (const c of comp) { const k = Math.round(c.x) + ':' + Math.round(c.y); const o = byPt.get(k) || { ...c, g: [0, 0] }; o.g = [o.g[0] + c.g[0], o.g[1] + c.g[1]]; byPt.set(k, o); }
  const pts = [...byPt.values()].filter((o) => Math.hypot(o.g[0], o.g[1]) > 1e-9);
  const maxQ = Math.max(1e-9, ...pts.map((o) => Math.hypot(o.g[0], o.g[1])));
  const memLab = {};
  for (const o of pts) {
    const mag = Math.hypot(o.g[0], o.g[1]), len = 14 + 24 * mag / maxQ;
    const ux = o.g[0] / mag, uy = -o.g[1] / mag;
    const x2 = T.X(o.x), y2 = T.Y(o.y), x1 = x2 - ux * len, y1 = y2 - uy * len;
    s += `<line class="d-load" style="opacity:.75" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="1.2"/><polygon class="d-load" style="opacity:.75" points="${arrowHead(x1, y1, x2, y2, 5)}"/>`;
    if (!memLab[o.member] || mag > memLab[o.member].mag) memLab[o.member] = { mag, x: x1, y: y1 };
  }
  for (const [id, o] of Object.entries(memLab)) {
    s += `<text class="d-loadtxt" x="${o.x + (id === 'colR' ? 6 : id === 'colL' ? -6 : 0)}" y="${o.y - 6}" text-anchor="${id === 'colR' ? 'start' : id === 'colL' ? 'end' : 'middle'}">${fmt(o.mag, 2)} kN/m</text>`;
  }
  return s;
}

function memberStations(r, id) { return r.st[id]; }

function diagramSVG(T, r, kind) {
  const prep = S.prep;
  const key = { M: 'M', V: 'V', N: 'N' }[kind];
  const unit = kind === 'M' ? 'kN·m' : 'kN';
  const conv = kind === 'M' ? (v) => v / 1e6 : (v) => v / 1e3;
  let vmax = 0;
  for (const mb of prep.geo.members) for (const x of memberStations(r, mb.id)) vmax = Math.max(vmax, Math.abs(x[key]));
  const sc = vmax > 0 ? 70 / vmax : 0;
  let s = '', labels = '';
  for (const mb of prep.geo.members) {
    const st = memberStations(r, mb.id);
    const ny = [-mb.s, mb.c]; // eje local y
    const sign = kind === 'M' ? -1 : 1; // momento en el lado de tensión
    const pts = st.map((x) => {
      const bx = mb.a.x + mb.c * x.s, by = mb.a.y + mb.s * x.s;
      const off = sign * x[key] * sc;
      return [T.X(bx) + ny[0] * off, T.Y(by) - ny[1] * off, x];
    });
    const base0 = [T.X(mb.a.x), T.Y(mb.a.y)], base1 = [T.X(mb.b.x), T.Y(mb.b.y)];
    // dividir en tramos de signo para colorear
    let poly = `${P(base0[0], base0[1])} ` + pts.map((q) => P(q[0], q[1])).join(' ') + ` ${P(base1[0], base1[1])}`;
    const neg = st.reduce((a, x) => a + x[key], 0) < 0;
    s += `<polygon class="d-diag ${neg ? 'neg' : ''}" points="${poly}"/>`;
    // etiquetas: extremo máximo y extremos de barra
    const iMax = st.reduce((bi, x, i) => (Math.abs(x[key]) > Math.abs(st[bi][key]) ? i : bi), 0);
    for (const i of new Set([0, iMax, st.length - 1])) {
      const q = pts[i]; const v = conv(st[i][key]);
      if (Math.abs(v) < 0.005 * conv(vmax)) continue;
      labels += `<text class="d-txt mono" x="${q[0]}" y="${q[1] - 5}" text-anchor="middle" style="fill:var(--ink)">${fmt(v, 1)}</text>`;
    }
  }
  return { svg: s + labels, legend: `${kind === 'M' ? 'Momento' : kind === 'V' ? 'Cortante' : 'Axial'} (${unit})` };
}

function deformedSVG(T, r) {
  const prep = S.prep;
  const D = r.res ? r.res.D : null;
  if (!D) return '';
  const mesh = prep.mesh;
  let dmax = 0;
  for (let n = 0; n < mesh.nodes.length; n++) dmax = Math.max(dmax, Math.hypot(D[3 * n], D[3 * n + 1]));
  const amp = dmax > 0 ? 45 / (dmax * T.sc) : 1;
  let s = '';
  for (const mb of prep.geo.members) {
    const seq = [];
    mesh.segs[mb.id].forEach((e, k) => { const el = mesh.elems[e]; if (k === 0) seq.push(el.i); seq.push(el.j); });
    const pts = seq.map((n) => { const nd = mesh.nodes[n]; return P(T.X(nd.x + amp * D[3 * n]), T.Y(nd.y + amp * D[3 * n + 1])); });
    s += `<polyline class="d-defl" points="${pts.join(' ')}"/>`;
  }
  const nEL = mesh.nodeOf(prep.geo.pts.eaveL);
  s += `<text class="d-txt mono" x="${VW / 2}" y="28" text-anchor="middle">Amplificación ×${fmt(amp, 0)} · desplazamiento máx. ${fmt(dmax, 1)} mm · alero izq. Δx = ${fmt(D[3 * nEL], 1)} mm</text>`;
  return s;
}

function reactionsSVG(T, r) {
  const prep = S.prep;
  const R = r.res ? r.res.reactions : null;
  if (!R) return '';
  let s = '';
  for (const x of R) {
    const nd = prep.mesh.nodes[x.n], X = T.X(nd.x), Y = T.Y(nd.y) + 30;
    s += `<line class="d-react" x1="${X}" y1="${Y + 44}" x2="${X}" y2="${Y + 4}" stroke-width="2"/><polygon class="d-react" points="${arrowHead(X, Y + 44, X, Y + 4)}"/>`;
    const dir = x.fx >= 0 ? 1 : -1;
    s += `<line class="d-react" x1="${X - dir * 46}" y1="${Y + 50}" x2="${X - dir * 6}" y2="${Y + 50}" stroke-width="2"/><polygon class="d-react" points="${arrowHead(X - dir * 46, Y + 50, X - dir * 6, Y + 50)}"/>`;
    const anchor = nd.x < prep.geo.B / 2 ? 'end' : 'start', dx = nd.x < prep.geo.B / 2 ? -14 : 14;
    s += `<text class="d-reacttxt" x="${X + dx}" y="${Y + 2}" text-anchor="${anchor}">P = ${kN(x.fy, 1)} kN</text>`;
    s += `<text class="d-reacttxt" x="${X + dx}" y="${Y + 17}" text-anchor="${anchor}">V = ${kN(x.fx, 1)} kN</text>`;
    if (Math.abs(x.mz) > 1) s += `<text class="d-reacttxt" x="${X + dx}" y="${Y + 32}" text-anchor="${anchor}">M = ${kNm(x.mz, 1)} kN·m</text>`;
  }
  return s;
}

function lateralSVG() {
  const prep = S.prep;
  if (!prep) return frontSVG('geom');
  const e = S.p.estructura, geo = prep.geo;
  const nF = e.tipoMarco === 'varios' ? Math.max(2, Math.round(e.nMarcos)) : 1;
  const a = e.sep * 1000, D = nF > 1 ? (nF - 1) * a : (e.anchoTrib || e.sep) * 1000;
  const top = geo.hMax;
  const sc = Math.min((VW - 140) / Math.max(D, 1), (VH - 170) / top);
  const ox = (VW - D * sc) / 2, oy = VH - 90;
  const X = (x) => ox + x * sc, Y = (y) => oy - y * sc;
  let s = '';
  const H = geo.H;
  // largueros y polines (líneas longitudinales)
  const Ly = (e.LyCol > 0 ? e.LyCol * 1000 : H);
  for (let y = Ly; y < H - 1; y += Ly) s += `<line stroke="var(--steel-2)" stroke-width="1.5" x1="${X(0)}" y1="${Y(y)}" x2="${X(D)}" y2="${Y(y)}"/>`;
  s += `<line stroke="var(--steel)" stroke-width="2" x1="${X(0)}" y1="${Y(H)}" x2="${X(D)}" y2="${Y(H)}"/>`;
  if (top > H + 1) s += `<line stroke="var(--steel)" stroke-width="1.5" stroke-dasharray="7 5" x1="${X(0)}" y1="${Y(top)}" x2="${X(D)}" y2="${Y(top)}"/><text class="d-txt" x="${X(D) + 8}" y="${Y(top) + 4}">cumbrera</text>`;
  // contraventeo ilustrativo en crujías extremas
  if (nF > 2) for (const k of [0, nF - 2]) {
    s += `<line stroke="var(--steel-2)" stroke-dasharray="5 4" x1="${X(k * a)}" y1="${Y(0)}" x2="${X((k + 1) * a)}" y2="${Y(H)}"/><line stroke="var(--steel-2)" stroke-dasharray="5 4" x1="${X((k + 1) * a)}" y1="${Y(0)}" x2="${X(k * a)}" y2="${Y(H)}"/>`;
  }
  const analyzed = nF > 2 ? (e.marcoAnalizado === 'extremo' ? 0 : 1) : 0;
  for (let i = 0; i < nF; i++) {
    const x = nF > 1 ? i * a : D / 2;
    const hl = i === analyzed;
    s += `<rect x="${X(x) - 4}" y="${Y(H)}" width="8" height="${H * sc}" fill="${hl ? 'var(--accent)' : 'var(--surface-2)'}" stroke="${hl ? 'var(--accent)' : 'var(--steel)'}"/>`;
    s += `<text class="d-txt mono" x="${X(x)}" y="${Y(0) + 18}" text-anchor="middle">${i + 1}</text>`;
  }
  s += `<line class="d-support" x1="${X(0) - 20}" y1="${Y(0)}" x2="${X(D) + 20}" y2="${Y(0)}"/>`;
  const yb = Y(0) + 44;
  if (nF > 1) {
    s += dimLine(X(0), yb, X(a), yb, `a = ${m(a)} m`);
    s += dimLine(X(0), yb + 26, X(D), yb + 26, `D = ${m(D)} m`);
  } else s += dimLine(X(0), yb, X(D), yb, `ancho tributario ${m(D)} m`);
  s += dimLine(X(0) - 36, Y(0), X(0) - 36, Y(H), `${m(H)} m`, -16, true);
  s += `<text class="d-txt" x="${VW / 2}" y="28" text-anchor="middle">Vista lateral · marco analizado en rojo${nF > 2 ? ' · contraventeo ilustrativo en crujías extremas' : ''}</text>`;
  return `<svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Vista lateral de la nave">${s}</svg>`;
}

/* ---------- 3D alámbrico con rotación ---------- */
function draw3D(canvas) {
  const prep = S.prep; if (!prep) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const css = getComputedStyle(document.documentElement);
  const col = (n) => css.getPropertyValue(n).trim() || '#888';
  ctx.clearRect(0, 0, w, h);
  const e = S.p.estructura, geo = prep.geo;
  const nF = e.tipoMarco === 'varios' ? Math.max(2, Math.round(e.nMarcos)) : 1;
  const a = e.sep * 1000, D = nF > 1 ? (nF - 1) * a : 0;
  const cx = geo.B / 2, cy = geo.hMax / 2, cz = D / 2;
  const size = Math.max(geo.B, geo.hMax, D) || 1;
  const { yaw, pitch, zoom } = S.rot;
  const cyw = Math.cos(yaw), syw = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const f = Math.min(w, h) * 0.95 * zoom / size;
  const proj = (x, y, z) => {
    let X = x - cx, Y = y - cy, Z = z - cz;
    const x1 = cyw * X + syw * Z, z1 = -syw * X + cyw * Z;
    const y2 = cp * Y - sp * z1, z2 = sp * Y + cp * z1;
    const persp = 1 / (1 + z2 / (size * 3.2));
    return [w / 2 + x1 * f * persp, h / 2 - y2 * f * persp, z2];
  };
  const line = (p1, p2, color, width, dash) => {
    const A = proj(...p1), B = proj(...p2);
    ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);
    ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
  };
  // piso
  const pad = size * 0.06;
  ctx.fillStyle = col('--surface');
  const c1 = proj(-pad, 0, -pad), c2 = proj(geo.B + pad, 0, -pad), c3 = proj(geo.B + pad, 0, D + pad), c4 = proj(-pad, 0, D + pad);
  ctx.beginPath(); ctx.moveTo(c1[0], c1[1]); ctx.lineTo(c2[0], c2[1]); ctx.lineTo(c3[0], c3[1]); ctx.lineTo(c4[0], c4[1]); ctx.closePath(); ctx.fill();
  const analyzed = nF > 2 ? (e.marcoAnalizado === 'extremo' ? 0 : 1) : 0;
  const zs = nF > 1 ? Array.from({ length: nF }, (_, i) => i * a) : [0];
  // polines y largueros
  if (nF > 1) {
    for (const l of prep.purl.lines) {
      const mb = geo.members.find((x) => x.id === l.member);
      const x = mb.a.x + mb.c * l.pos, y = mb.a.y + mb.s * l.pos + 120;
      line([x, y, 0], [x, y, D], col('--steel-2'), 1);
    }
    const Ly = e.LyCol > 0 ? e.LyCol * 1000 : geo.H;
    for (let y = Ly; y < geo.H - 1; y += Ly) { line([0, y, 0], [0, y, D], col('--steel-2'), 1); line([geo.B, Math.min(y, geo.H2), 0], [geo.B, Math.min(y, geo.H2), D], col('--steel-2'), 1); }
    for (const k of [0, nF - 2]) if (nF > 2) {
      line([0, 0, k * a], [0, geo.H, (k + 1) * a], col('--steel-2'), 1, [4, 4]);
      line([0, geo.H, k * a], [0, 0, (k + 1) * a], col('--steel-2'), 1, [4, 4]);
    }
  }
  zs.forEach((z, i) => {
    const hl = i === analyzed;
    for (const mb of geo.members) line([mb.a.x, mb.a.y, z], [mb.b.x, mb.b.y, z], hl ? col('--accent') : col('--steel'), hl ? 3.2 : 2.4);
    for (const bx of [0, geo.B]) { const p = proj(bx, 0, z); ctx.fillStyle = col('--ink-2'); ctx.fillRect(p[0] - 3, p[1] - 2, 6, 4); }
  });
  ctx.setLineDash([]);
}

function bind3D(canvas) {
  let drag = null;
  canvas.addEventListener('pointerdown', (ev) => { drag = { x: ev.clientX, y: ev.clientY, yaw: S.rot.yaw, pitch: S.rot.pitch }; canvas.setPointerCapture(ev.pointerId); });
  canvas.addEventListener('pointermove', (ev) => {
    if (!drag) return;
    S.rot.yaw = drag.yaw + (ev.clientX - drag.x) * 0.008;
    S.rot.pitch = Math.max(-0.2, Math.min(1.35, drag.pitch + (ev.clientY - drag.y) * 0.006));
    draw3D(canvas);
  });
  canvas.addEventListener('pointerup', () => { drag = null; });
  canvas.addEventListener('wheel', (ev) => { ev.preventDefault(); S.rot.zoom = Math.max(0.4, Math.min(3, S.rot.zoom * (ev.deltaY < 0 ? 1.1 : 0.9))); draw3D(canvas); }, { passive: false });
}

/* ---------- panel de visualización ---------- */
function visualMode() {
  if (S.step === 3 || S.step === 4) return 'loads';
  if ((S.step === 5 || S.step === 7) && S.alt && S.alt.results) return 'diag';
  return 'geom';
}
function drawVisual(target) {
  const host = target || $('#viewer'); if (!host) return;
  const cv = $('.canvas', host);
  if (!cv) return;
  if (S.view === '3d') {
    cv.innerHTML = '<canvas aria-label="Modelo 3D, arrastra para girar"></canvas><span class="hint-3d">Arrastra para girar · rueda para acercar</span>';
    const c = $('canvas', cv); bind3D(c); requestAnimationFrame(() => draw3D(c));
  } else if (S.view === 'lat') cv.innerHTML = lateralSVG();
  else cv.innerHTML = frontSVG(visualMode());
  const lg = $('.legend', host);
  if (lg) lg.innerHTML = legendHTML();
}
function legendHTML() {
  const mode = visualMode();
  if (S.view === 'front' && mode === 'loads') {
    const cs = S.prep && S.prep.lc.cases.find((c) => c.id === S.loadCase);
    return `<span><i style="background:var(--accent)"></i>${esc(cs ? cs.name : 'Caso')}${cs && cs.fam === 'D' ? ' + peso propio del marco' : ''}</span><span class="muted">Fuerzas en kN y kN/m</span>`;
  }
  if (S.view === 'front' && mode === 'diag') {
    const r = S.alt.results[Math.min(S.comboIdx, S.alt.results.length - 1)];
    const name = { M: 'Momento flector (kN·m), dibujado del lado de tensión', V: 'Cortante (kN)', N: 'Axial (kN), tensión +', D: 'Deformada', R: 'Reacciones en apoyos' }[S.diag];
    return `<span><i style="background:var(--info)"></i>${name}</span><span class="muted">${esc(r.combo.nombre)}${r.combo.key.includes('·') ? ' · ' + esc(r.combo.key.split('·')[1]) : ''} · ${S.alt.secondOrder ? '2º orden (análisis directo)' : '1er orden'}</span>`;
  }
  const prof = currentProf();
  return `<span><i style="background:var(--steel)"></i>Columna ${esc(secLabel(prof.col))}</span><span><i style="background:var(--steel)"></i>Viga ${esc(secLabel(prof.beam))}</span><span><i style="background:var(--ink-2)"></i>Polines</span>`;
}
function viewerHTML(id = 'viewer') {
  const b = (v, l, icon) => `<button class="vbtn" type="button" data-view="${v}" aria-pressed="${S.view === v}">${icon}${l}</button>`;
  return `<div class="viewer" id="${id}">
    <div class="bar-top">
      ${b('front', 'Frontal', ICON.front)}${b('lat', 'Lateral', ICON.lat)}${b('3d', 'Vista 3D', ICON.cube)}
      <button class="vbtn" type="button" data-cotas aria-pressed="${S.cotas}">${ICON.ruler}Cotas</button>
      <button class="vbtn icon" type="button" data-zoom aria-label="Ampliar dibujo">${ICON.expand}</button>
    </div>
    <div class="canvas"></div>
    <div class="legend"></div>
  </div>`;
}
function bindViewer(host) {
  $$('[data-view]', host).forEach((bt) => bt.addEventListener('click', () => { S.view = bt.dataset.view; $$('[data-view]', host).forEach((x) => x.setAttribute('aria-pressed', x.dataset.view === S.view)); drawVisual(host); }));
  const ct = $('[data-cotas]', host); if (ct) ct.addEventListener('click', () => { S.cotas = !S.cotas; ct.setAttribute('aria-pressed', S.cotas); drawVisual(host); });
  const z = $('[data-zoom]', host); if (z) z.addEventListener('click', openZoom);
}
function openZoom() {
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'Dibujo ampliado');
  ov.innerHTML = `<div class="box"><header><h3>Dibujo ampliado</h3><div class="row"><span class="muted small">Rueda: acercar · arrastrar: mover</span><button class="btn sm" type="button" data-close>Cerrar</button></div></header>${viewerHTML('viewer-big')}</div>`;
  document.body.appendChild(ov);
  const host = $('#viewer-big', ov);
  $('[data-zoom]', host).remove();
  bindViewer(host); drawVisual(host);
  enablePanZoom(host);
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (ev) => { if (ev.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  $('[data-close]', ov).addEventListener('click', close);
  ov.addEventListener('click', (ev) => { if (ev.target === ov) close(); });
}
function enablePanZoom(host) {
  const cv = $('.canvas', host);
  let vb = null, drag = null;
  const svg = () => $('svg', cv);
  cv.addEventListener('wheel', (ev) => {
    const s = svg(); if (!s) return; ev.preventDefault();
    vb = vb || [0, 0, VW, VH];
    const r = s.getBoundingClientRect(), fx = (ev.clientX - r.left) / r.width, fy = (ev.clientY - r.top) / r.height;
    const k = ev.deltaY < 0 ? 0.85 : 1.18;
    const nw = Math.min(VW * 1.5, Math.max(VW * 0.12, vb[2] * k)), nh = nw * VH / VW;
    vb = [vb[0] + (vb[2] - nw) * fx, vb[1] + (vb[3] - nh) * fy, nw, nh];
    s.setAttribute('viewBox', vb.map((v) => v.toFixed(1)).join(' '));
  }, { passive: false });
  cv.addEventListener('pointerdown', (ev) => { if (!svg()) return; drag = { x: ev.clientX, y: ev.clientY, vb: (vb || [0, 0, VW, VH]).slice() }; });
  cv.addEventListener('pointermove', (ev) => {
    const s = svg(); if (!drag || !s) return;
    const r = s.getBoundingClientRect();
    vb = [drag.vb[0] - (ev.clientX - drag.x) * drag.vb[2] / r.width, drag.vb[1] - (ev.clientY - drag.y) * drag.vb[3] / r.height, drag.vb[2], drag.vb[3]];
    s.setAttribute('viewBox', vb.map((v) => v.toFixed(1)).join(' '));
  });
  window.addEventListener('pointerup', () => { drag = null; });
  $$('[data-view]', host).forEach((b) => b.addEventListener('click', () => { vb = null; }));
}

/* ---------- placa base en planta ---------- */
function plateSVG(col) {
  const b = S.p.base;
  const W = 520, H = 420;
  const PB = b.ped.B, PN = b.ped.N;
  const sc = Math.min((W - 120) / PB, (H - 100) / PN);
  const cx = W / 2, cy = H / 2 - 6;
  const R = (w, h, cls, extra = '') => `<rect x="${cx - w * sc / 2}" y="${cy - h * sc / 2}" width="${w * sc}" height="${h * sc}" ${cls} ${extra}/>`;
  let s = R(PB, PN, 'fill="var(--surface)" stroke="var(--steel-2)" stroke-dasharray="6 4"');
  s += R(b.placa.B, b.placa.N, 'fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="1.5"');
  // huella de columna (N vertical = peralte)
  const kind = col ? NX.FAMILY_KIND[col.fam] : 'I';
  if (col) {
    const d = col.d || col.D, bf = kind === 'I' ? col.bf : kind === 'HSSR' ? col.B : col.D;
    if (kind === 'I') {
      const tf = col.tf, tw = col.tw;
      s += `<path fill="var(--steel)" d="M${cx - bf * sc / 2},${cy - d * sc / 2}h${bf * sc}v${tf * sc}h${-(bf - tw) * sc / 2}v${(d - 2 * tf) * sc}h${(bf - tw) * sc / 2}v${tf * sc}h${-bf * sc}v${-tf * sc}h${(bf - tw) * sc / 2}v${-(d - 2 * tf) * sc}h${-(bf - tw) * sc / 2}z"/>`;
    } else if (kind === 'HSSR') {
      s += `<rect x="${cx - bf * sc / 2}" y="${cy - d * sc / 2}" width="${bf * sc}" height="${d * sc}" fill="none" stroke="var(--steel)" stroke-width="${Math.max(2, col.t * sc)}"/>`;
    } else s += `<circle cx="${cx}" cy="${cy}" r="${d * sc / 2}" fill="none" stroke="var(--steel)" stroke-width="${Math.max(2, (col.t || 6) * sc)}"/>`;
  }
  const a = b.anclas, nRow = Math.max(1, Math.round(a.n / 2));
  for (const sy of [-1, 1]) for (let k = 0; k < nRow; k++) {
    const x = cx + (k - (nRow - 1) / 2) * a.sx * sc, y = cy + sy * a.sy / 2 * sc;
    s += `<circle cx="${x}" cy="${y}" r="${Math.max(3, a.d / 2 * sc)}" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/>`;
  }
  // cotas
  const yb = cy + PN * sc / 2 + 22;
  s += dimLine(cx - b.placa.B * sc / 2, yb, cx + b.placa.B * sc / 2, yb, `B = ${b.placa.B} mm`);
  const xl = cx - PB * sc / 2 - 22;
  s += dimLine(xl, cy - b.placa.N * sc / 2, xl, cy + b.placa.N * sc / 2, `N = ${b.placa.N}`, -14, true);
  s += `<text class="d-txt" x="${cx + PB * sc / 2 - 4}" y="${cy - PN * sc / 2 - 8}" text-anchor="end">Pedestal ${PB} × ${PN} mm</text>`;
  s += `<text class="d-txt" x="${cx}" y="${cy - PN * sc / 2 - 8}" text-anchor="middle" style="fill:var(--accent)">${a.n} anclas ⌀${NX.ANCHOR_SIZES.find((x) => x[0] === a.d)?.[1] || a.d + ' mm'}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Placa base en planta" style="width:100%;height:auto;max-height:420px">${s}</svg>`;
}

/* ---------- sección transversal ---------- */
function sectionSVG(sec) {
  if (!sec) return '';
  const W = 240, H = 240, kind = sec.fam;
  const d = sec.d || sec.D || 100, bf = sec.bf || sec.B || sec.D || d;
  const sc = 170 / Math.max(d, bf);
  const cx = W / 2, cy = H / 2;
  const F = 'fill="var(--steel)" stroke="var(--ink-2)" stroke-width="1"';
  let s = '';
  const tf = Math.max(1, sec.tf || sec.t || d * 0.06), tw = Math.max(1, sec.tw || sec.t || d * 0.04);
  if (['IR', 'IE', 'IS'].includes(kind)) {
    s = `<path ${F} d="M${cx - bf * sc / 2},${cy - d * sc / 2}h${bf * sc}v${tf * sc}h${-(bf - tw) * sc / 2}v${(d - 2 * tf) * sc}h${(bf - tw) * sc / 2}v${tf * sc}h${-bf * sc}v${-tf * sc}h${(bf - tw) * sc / 2}v${-(d - 2 * tf) * sc}h${-(bf - tw) * sc / 2}z"/>`;
  } else if (kind === 'ORR' || kind === 'ORC') {
    const t = sec.t || 5;
    s = `<rect x="${cx - bf * sc / 2}" y="${cy - d * sc / 2}" width="${bf * sc}" height="${d * sc}" rx="${2 * t * sc}" ${F}/><rect x="${cx - (bf - 2 * t) * sc / 2}" y="${cy - (d - 2 * t) * sc / 2}" width="${(bf - 2 * t) * sc}" height="${(d - 2 * t) * sc}" rx="${t * sc}" fill="var(--bg)" stroke="var(--ink-2)"/>`;
  } else if (kind === 'OC') {
    s = `<circle cx="${cx}" cy="${cy}" r="${d * sc / 2}" ${F}/><circle cx="${cx}" cy="${cy}" r="${(d / 2 - (sec.t || 4)) * sc}" fill="var(--bg)" stroke="var(--ink-2)"/>`;
  } else if (kind === 'OS') {
    s = `<circle cx="${cx}" cy="${cy}" r="${d * sc / 2}" ${F}/>`;
  } else if (kind === 'CE' || kind === 'CF') {
    const t = kind === 'CF' ? (sec.t || 2) : tf, w = kind === 'CF' ? t : tw, x0 = cx - bf * sc / 2;
    s = `<path ${F} d="M${x0},${cy - d * sc / 2}h${bf * sc}v${t * sc}h${-(bf - w) * sc}v${(d - 2 * t) * sc}h${(bf - w) * sc}v${t * sc}h${-bf * sc}z"/>`;
  } else if (kind === 'ZF') {
    const t = sec.t || 2, x0 = cx;
    s = `<path ${F} d="M${x0 - t * sc / 2},${cy - d * sc / 2}h${bf * sc}v${t * sc}h${-(bf - t) * sc}v${(d - t) * sc}h${-(bf - t) * sc}v${-t * sc}h${(bf - t) * sc}z" transform="translate(${-bf * sc / 2 + t * sc},0)"/>`;
  } else if (kind === 'TR') {
    s = `<path ${F} d="M${cx - bf * sc / 2},${cy - d * sc / 2}h${bf * sc}v${tf * sc}h${-(bf - tw) * sc / 2}v${(d - tf) * sc}h${-tw * sc}v${-(d - tf) * sc}h${-(bf - tw) * sc / 2}z"/>`;
  } else if (kind === 'LI' || kind === 'LD') {
    const nums = sec.des.split('x').map((v) => parseFloat(v));
    const a = nums[0], b2 = kind === 'LD' ? nums[1] : nums[0], t = nums[nums.length - 1];
    const k = 170 / Math.max(a, b2);
    s = `<path ${F} d="M${cx - b2 * k / 2},${cy - a * k / 2}h${t * k}v${(a - t) * k}h${(b2 - t) * k}v${t * k}h${-b2 * k}z"/>`;
  } else if (kind === 'IC') {
    s = `<path ${F} d="M${cx - bf * sc / 2},${cy - d * sc / 2}h${bf * sc}v${tf * sc}h${-(bf - tw) * sc / 2}v${(d - 2 * tf) * sc}h${(bf - tw) * sc / 2}v${tf * sc}h${-bf * sc}v${-tf * sc}h${(bf - tw) * sc / 2}v${-(d - 2 * tf) * sc}h${-(bf - tw) * sc / 2}z"/><path ${F} transform="rotate(90 ${cx} ${cy})" d="M${cx - bf * sc / 2},${cy - d * sc / 2}h${bf * sc}v${tf * sc}h${-(bf - tw) * sc / 2}v${(d - 2 * tf) * sc}h${(bf - tw) * sc / 2}v${tf * sc}h${-bf * sc}v${-tf * sc}h${(bf - tw) * sc / 2}v${-(d - 2 * tf) * sc}h${-(bf - tw) * sc / 2}z"/>`;
  }
  s += `<line x1="${cx - 105}" y1="${cy}" x2="${cx + 105}" y2="${cy}" stroke="var(--accent)" stroke-dasharray="5 4"/><text x="${cx + 108}" y="${cy + 4}" class="d-txt" style="fill:var(--accent)">x</text>`;
  s += `<line x1="${cx}" y1="${cy - 105}" x2="${cx}" y2="${cy + 105}" stroke="var(--accent)" stroke-dasharray="5 4"/><text x="${cx + 4}" y="${cy - 108}" class="d-txt" style="fill:var(--accent)">y</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sección ${esc(sec.des)}" style="width:100%;max-width:260px;height:auto">${s}</svg>`;
}

// ---- steps.js
/* ============ Nodex · pasos del configurador ============ */
const STEPS = [
  { n: 1, t: 'Estructura', d: 'Tipo, geometría y apoyos' },
  { n: 2, t: 'Cubierta y polines', d: 'KR-18, R-100 o Losacero' },
  { n: 3, t: 'Cargas', d: 'Acciones y combinaciones' },
  { n: 4, t: 'Distribución', d: 'De la cubierta al marco' },
  { n: 5, t: 'Análisis', d: 'Método de rigideces' },
  { n: 6, t: 'Perfiles', d: 'Comparar alternativas' },
  { n: 7, t: 'Placa base', d: 'Placa y anclas' },
];

function renderConfig(main) {
  main.innerHTML = `<div class="cfg">
    <nav class="steps" aria-label="Pasos">${STEPS.map((s) => `<button class="step" type="button" data-step="${s.n}"><span class="dot">${s.n}</span><span>${s.t}<small>${s.d}</small></span></button>`).join('')}</nav>
    <section class="content" id="content" aria-live="polite"></section>
    <aside class="visual">${viewerHTML()}<div id="vis-extra"></div></aside>
  </div>`;
  $$('[data-step]', main).forEach((b) => b.addEventListener('click', () => goStep(+b.dataset.step)));
  bindViewer($('#viewer'));
  renderStep();
}
function goStep(n) {
  S.step = n;
  if ((n === 5 || n === 7) && !S.alt) runDetail();
  if (n === 3 || n === 4) { if (S.view === 'lat') S.view = 'front'; }
  renderStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function renderStep() {
  const c = $('#content'); if (!c) return;
  $$('[data-step]').forEach((b) => { b.setAttribute('aria-current', +b.dataset.step === S.step ? 'step' : 'false'); b.classList.toggle('done', +b.dataset.step < S.step); });
  $('.cfg')?.classList.toggle('wide', S.step === 6);
  const fn = [null, step1, step2, step3, step4, step5, step6, step7][S.step];
  c.innerHTML = fn();
  bind(c);
  STEP_BIND[S.step]?.(c);
  refreshDerived();
  $$('[data-view]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.view === S.view));
  drawVisual();
  $('#vis-extra').innerHTML = VIS_EXTRA[S.step]?.() || '';
  bindVisExtra();
}
function stepHead(t, sub) { return `<div class="head"><span class="eyebrow">Paso ${S.step} de 7</span><h1>${t}</h1><p>${sub}</p></div>`; }
function stepFoot() {
  const prev = S.step > 1 ? `<button class="btn outline" type="button" data-go="${S.step - 1}">← ${STEPS[S.step - 2].t}</button>` : '<span></span>';
  const next = S.step < 7 ? `<button class="btn primary" type="button" data-go="${S.step + 1}">Continuar a ${STEPS[S.step].t.toLowerCase()} →</button>` : '';
  return `<div class="nav-foot">${prev}${next}</div>`;
}
document.addEventListener('click', (ev) => { const g = ev.target.closest('[data-go]'); if (g) goStep(+g.dataset.go); });

function choice(path, val, label, icon, small, after) {
  const v = getPath(S.p, path);
  return `<button type="button" class="choice" data-set="${path}=${val}" ${after ? `data-after="${after}"` : ''} aria-pressed="${String(v) === String(val)}">${icon || ''}<span>${label}</span>${small ? `<small>${small}</small>` : ''}</button>`;
}

/* ---------------- 1. Estructura ---------------- */
function step1() {
  const e = S.p.estructura;
  let alturas = '';
  if (e.techo === 'dos') {
    alturas = `<div class="field" style="grid-column:1/-1"><span class="lab">Definir la cumbrera por</span>${seg('estructura.entradaAltura', [['cumbrera', 'Altura de cumbrera'], ['pendiente', 'Pendiente']])}</div>
      ${e.entradaAltura === 'pendiente' ? num('estructura.pendiente', 'Pendiente', '%') : num('estructura.hc', 'Altura de cumbrera', 'm', { hint: 'Medida desde el nivel de desplante.' })}`;
  } else if (e.techo === 'una') {
    alturas = `<div class="field" style="grid-column:1/-1"><span class="lab">Definir el alero derecho por</span>${seg('estructura.entradaAltura', [['cumbrera', 'Altura'], ['pendiente', 'Pendiente']])}</div>
      ${e.entradaAltura === 'pendiente' ? num('estructura.pendiente', 'Pendiente', '%') : num('estructura.H2', 'Altura de columna derecha', 'm')}`;
  }
  return `${stepHead('Estructura', 'Define el tipo de marco, sus dimensiones y las condiciones de apoyo. Las vistas se actualizan al capturar.')}
  <div class="panel"><header><h2>Tipo de estructura</h2></header>
    <div class="choices">
      ${choice('estructura.tipoMarco', 'simple', 'Marco simple', FRAME_ICON.simple, 'Un marco con ancho tributario')}
      ${choice('estructura.tipoMarco', 'varios', 'Varios marcos', FRAME_ICON.varios, 'Nave con polines continuos o simples')}
    </div>
  </div>
  <div class="panel"><header><h2>Forma de la cubierta</h2></header>
    <div class="choices">
      ${choice('estructura.techo', 'dos', 'Dos aguas', FRAME_ICON.dos)}
      ${choice('estructura.techo', 'una', 'Un agua', FRAME_ICON.una)}
      ${choice('estructura.techo', 'plana', 'Plana', FRAME_ICON.plana)}

      ${alturas}
      ${e.tipoMarco === 'varios' ? num('estructura.nMarcos', 'Número de marcos', 'pza', { s: 1 }) + num('estructura.sep', 'Separación entre marcos (a)', 'm') : num('estructura.anchoTrib', 'Ancho tributario', 'm', { hint: 'Ancho de cubierta que descarga en el marco.' })}
    </div>
    <div data-derived="geo"></div>
  </div>
  <div class="panel"><header><h2>Apoyos y arriostramiento</h2></header>
    <div class="choices">
      ${choice('estructura.apoyo', 'articulado', 'Articulado', FRAME_ICON.art, 'Placa con anclas, sin momento')}
      ${choice('estructura.apoyo', 'empotrado', 'Empotrado', FRAME_ICON.emp, 'Base resistente a momento')}
    </div>
    <div class="grid2">
      ${num('estructura.LyCol', 'Arriostramiento lateral de columnas (Ly)', 'm', { hint: 'Separación de largueros con puntal o contraventeo. Se usa como Lb y longitud fuera del plano.' })}
      ${num('estructura.LbInf', 'Tornapuntas del patín inferior de la viga', 'm', { hint: 'Lb para momento negativo (patín inferior comprimido). El patín superior se arriostra en cada polín.' })}
    </div>
    ${e.tipoMarco === 'varios' ? `<div class="field"><span class="lab">Marco que se analiza</span>${seg('estructura.marcoAnalizado', [['interior', 'Interior más cargado'], ['extremo', 'Marco extremo']])}</div>` : ''}
    <div class="note">Una base semirrígida necesita una rigidez rotacional cuantificada; por ahora se ofrecen sólo los casos articulado y empotrado (Guía 2.1). Lb no se toma automáticamente como la separación de polines para el patín inferior (Guía 7.3).</div>
  </div>
  ${stepFoot()}`;
}

/* ---------------- 2. Cubierta y polines ---------------- */

      ${num('cubierta.lamina.t', 'Espesor base del acero', 'mm', { flag: 'verificar', hint: 'Valor típico por calibre; confirmar con la ficha del producto.' })}
      ${num('cubierta.lamina.factor', 'Factor de desarrollo', '—', { flag: 'verificar', hint: 'Ancho desarrollado / ancho útil cubierto. KR-18: lámina de 24" para 18" útiles ≈ 1.33.' })}
      ${num('cubierta.lamina.masaManual', 'Masa por área de la ficha técnica', 'kg/m²', { hint: 'Si la capturas (> 0) sustituye al cálculo ρ·t·f.' })}

      ${num('cubierta.losacero.wr', 'Ancho medio del nervio', 'mm', { flag: 'verificar' })}
      ${num('cubierta.losacero.sr', 'Paso de nervios', 'mm', { flag: 'verificar' })}
      ${num('cubierta.losacero.tsup', 'Concreto sobre cresta', 'mm')}

    <div class="tbl-wrap"><table><thead><tr><th>Capa</th><th>Masa (kg/m²)</th><th></th></tr></thead><tbody>${capas || '<tr><td colspan="3" class="muted">Sin capas adicionales.</td></tr>'}</tbody></table></div>

/* ---------------- 3. Cargas ---------------- */
function step3() {
  const c = S.p.cargas, w = c.viento, s = c.sismo;
  const eq = (c.equipos || []).map((q, i) => `<tr><td><input class="cell wide" data-k="cargas.equipos.${i}.nombre" data-t="str" aria-label="Equipo"></td><td><input class="cell" data-k="cargas.equipos.${i}.masa" inputmode="decimal" aria-label="Masa"></td><td><input class="cell" data-k="cargas.equipos.${i}.x" inputmode="decimal" aria-label="Posición" data-s="1"></td><td><button class="btn ghost sm" type="button" data-del="cargas.equipos.${i}">Quitar</button></td></tr>`).join('');
  const mem = [['colL', 'Columna izq.'], ['rafL', S.p.estructura.techo === 'dos' ? 'Viga izq.' : 'Viga'], ...(S.p.estructura.techo === 'dos' ? [['rafR', 'Viga der.']] : []), ['colR', 'Columna der.']];
  const opt = (arr, v) => arr.map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${l}</option>`).join('');
  const extra = (c.extra || []).map((q, i) => {
    const pre = `cargas.extra.${i}`;

    return `<tr>

      <td><select class="cell" data-k="${pre}.miembro" data-t="str" data-s="1">${opt(mem, q.miembro)}</select></td>
      <td><select class="cell" style="width:120px" data-k="${pre}.tipo" data-t="str" data-s="1">${opt([['puntual', 'Puntual'], ['uniforme', 'Uniforme total'], ['parcial', 'Uniforme parcial'], ['trapecio', 'Trapezoidal'], ['momento', 'Momento puntual']], q.tipo)}</select></td>
      <td>${q.tipo === 'momento' ? '—' : `<select class="cell" style="width:120px" data-k="${pre}.dir" data-t="str" data-s="1">${opt([['gy', 'Vertical ↓'], ['gx', 'Horizontal →'], ['ly', 'Normal a barra']], q.dir)}</select>`}</td>
      <td>${usesAB ? `<input class="cell" data-k="${pre}.a" inputmode="decimal" data-s="1" aria-label="a"> – <input class="cell" data-k="${pre}.b" inputmode="decimal" data-s="1" aria-label="b">` : q.tipo === 'uniforme' ? 'toda' : `<input class="cell" data-k="${pre}.x" inputmode="decimal" data-s="1" aria-label="x">`}</td>
      <td>${usesQ ? `<input class="cell" data-k="${pre}.qa" inputmode="decimal" aria-label="qa">${q.tipo === 'trapecio' ? ` → <input class="cell" data-k="${pre}.qb" inputmode="decimal" aria-label="qb">` : ''} kN/m` : q.tipo === 'momento' ? `<input class="cell" data-k="${pre}.M" inputmode="decimal" aria-label="M"> kN·m` : `<input class="cell" data-k="${pre}.P" inputmode="decimal" aria-label="P"> kN`}</td>
      <td><button class="btn ghost sm" type="button" data-del="${pre}">Quitar</button></td></tr>`;
  }).join('');
  return `${stepHead('Cargas', 'Define las acciones del proyecto y su ubicación. Cada caso se conserva por separado y se combina con los factores del método elegido.')}
  <div class="panel"><header><h2>Ubicación del proyecto</h2></header>

      <div class="field"><span class="lab">Referida a</span>${seg('cargas.LrRef', [['hor', 'Proyección horizontal'], ['sup', 'Superficie inclinada']])}</div>

  </div>

    <div class="grid2">${w.modo === 'q' ? num('cargas.viento.q', 'Presión dinámica de diseño qz', 'kN/m²') : num('cargas.viento.V', 'Velocidad de diseño VD', 'km/h', { hint: 'Ya afectada por los factores de exposición y topografía de la norma elegida.' }) + num('cargas.viento.G', 'Factor de corrección por densidad G', '—')}</div>

      ${num('cargas.viento.cpeTechoSot', 'Cpe cubierta sotavento', '—')}${num('cargas.viento.cpiPos', 'Cpi presión interior', '—')}${num('cargas.viento.cpiNeg', 'Cpi succión interior', '—')}

function combosPanel() {
  const D = S.p.diseno;
  const famCols = ['D', 'Lr', 'S', 'W', 'E'];
  const tbl = (key, title, serv) => {
    const list = D.combos[key];
    return `<h3>${title}</h3><div class="tbl-wrap"><table><thead><tr><th>Combinación</th>${famCols.map((f) => `<th class="num">${f}</th>`).join('')}${serv ? '<th class="num">Flecha L/n</th><th class="num">Deriva H/n</th>' : ''}<th></th></tr></thead><tbody>
      ${list.map((c, i) => `<tr><td><input class="cell wide" data-k="diseno.combos.${key}.${i}.nombre" data-t="str" aria-label="Nombre"></td>
        ${famCols.map((f) => `<td class="num"><input class="cell" style="width:56px" inputmode="decimal" data-k="diseno.combos.${key}.${i}.f.${f}" aria-label="Factor ${f}"></td>`).join('')}
        ${serv ? `<td class="num"><input class="cell" style="width:60px" inputmode="decimal" data-k="diseno.combos.${key}.${i}.flecha" aria-label="n flecha"></td><td class="num"><input class="cell" style="width:60px" inputmode="decimal" data-k="diseno.combos.${key}.${i}.deriva" aria-label="n deriva"></td>` : ''}
        <td><button class="btn ghost sm" type="button" data-del="diseno.combos.${key}.${i}">Quitar</button></td></tr>`).join('')}
      </tbody></table></div><div class="row"><button class="btn sm" type="button" data-addcombo="${key}">Agregar combinación</button></div>`;
  };
  return `<details class="panel" ${S.openCombos ? 'open' : ''} id="combos"><summary>Combinaciones de carga · ${esc(D.metodo)}</summary>
    <div class="row between"><div class="field"><span class="lab">Método de diseño</span>${seg('diseno.metodo', [['LRFD', 'LRFD (φRn)'], ['ASD', 'ASD (Rn/Ω)']], 'metodo')}</div>
    <button class="btn sm" type="button" data-preset>Restaurar valores de referencia</button></div>
    <div class="note">Factores de referencia de ASCE 7-22 (secc. 2.3 y 2.4). Cada coeficiente debe proceder del reglamento y la edición adoptados (Guía 5.4). Una combinación se omite si su acción principal no existe; las variantes de viento, Lr por faldón y sismo ± se expanden automáticamente.</div>
    ${tbl(D.metodo, `Resistencia · ${D.metodo}`)}
    ${tbl('SERV', 'Servicio', true)}
    <div data-derived="combos"></div>
  </details>`;
}

/* ---------------- 4. Distribución ---------------- */
function step4() {
  return `${stepHead('Distribución de cargas', 'La cubierta descarga en los polines y sus reacciones llegan a las vigas principales. Selecciona un caso para verlo sobre el marco.')}
  <div class="panel"><header><h2>Modelo de transferencia</h2><span class="muted small">Ecs. 20 a 23</span></header>
    ${seg('distribucion', [['puntual', 'Reacciones de polines como cargas puntuales'], ['uniforme', 'Carga uniforme equivalente']])}
    <div class="note">No se aplican a la vez las reacciones puntuales y la carga uniforme equivalente para la misma cubierta (Guía 5.2). El viento se aplica como presión normal distribuida sobre cada miembro.</div>
    <div data-derived="share"></div>
  </div>
  <div class="panel"><header><h2>Casos de carga</h2></header><div data-derived="cases"></div></div>
  <div class="panel"><header><h2>Reacciones de polines sobre el marco</h2></header><div data-derived="purlTable"></div></div>
  ${stepFoot()}`;
}

/* ---------------- 5. Análisis ---------------- */
function profPicker(role) {
  const id = S.p.seleccion[role];
  const sec = secById(id) || currentProf()[role];
  const fams = ['IR', 'IS', 'IE', 'ORR', 'ORC', 'OC', 'CE', 'TR', 'IC'];
  return `<div class="field"><span class="lab">${role === 'beam' ? 'Vigas' : 'Columnas'}</span>
    <div class="row" style="flex-wrap:nowrap">
      <select class="plain" data-pfam="${role}" aria-label="Familia" style="width:120px">${fams.map((f) => `<option value="${f}" ${sec && sec.fam === f ? 'selected' : ''}>${FAM_SHORT[f]}</option>`).join('')}</select>
      <select class="plain" data-pdes="${role}" aria-label="Perfil" style="flex:1;min-width:0">${famRows(sec ? sec.fam : 'IR').map((r) => `<option value="${esc(r.des)}" ${sec && r.des === sec.des ? 'selected' : ''}>${esc(r.des)} · ${fmt(r.m, 1)} kg/m</option>`).join('')}</select>
    </div></div>`;
}
function step5() {
  const D = S.p.diseno;
  return `${stepHead('Análisis del marco', 'Método de rigideces con elementos de 6 grados de libertad. Cada alternativa se analiza con su propio peso y rigidez.')}
  <div class="panel"><header><h2>Método</h2></header>
    <div class="grid2">
      <div class="field"><span class="lab">Diseño</span>${seg('diseno.metodo', [['LRFD', 'LRFD'], ['ASD', 'ASD']], 'metodo')}</div>
      <div class="field"><span class="lab">Análisis</span>${seg('diseno.analisis', [['directo', 'Directo (2º orden)'], ['primer', 'Primer orden']])}</div>
    </div>
    <div class="note">${D.analisis === 'directo'
      ? 'Método de análisis directo (AISC C2): P-Δ y P-δ con matriz geométrica iterada, rigidez reducida 0.8 EA y 0.8 EI, cargas nocionales 0.002αΣY + 0.001αΣY en lugar de τb. Se permite K = 1 en compresión. En ASD se analiza a 1.6 veces la combinación.'
      : 'Primer orden: K de columnas por nomograma de marco no arriostrado (fórmula de Dumonteil, G base = 10 articulado o 1 empotrado). Los efectos de segundo orden quedan pendientes y se reportan como tales (Guía 6.7).'}</div>
  </div>
  <div class="panel"><header><h2>Perfiles de esta alternativa</h2>${S.p.seleccion.beam ? '<span class="muted small">Elegidos desde la comparación o manualmente</span>' : ''}</header>
    <div class="grid2">${profPicker('beam')}${profPicker('col')}</div>
    <div class="row"><button class="btn primary" type="button" data-run>Analizar marco</button><span class="muted small">Peso propio y rigidez se actualizan con estos perfiles.</span></div>
  </div>
  <div data-derived="analysis"></div>
  ${stepFoot()}`;
}

/* ---------------- 6. Perfiles ---------------- */
const ALL_FAMS = ['IR', 'IS', 'IE', 'ORR', 'ORC', 'OC', 'CE', 'TR', 'IC', 'LI', 'LD', 'OS', 'CF', 'ZF'];
function candPanel(role, title) {
  const f = S.p.candidatos[role];
  return `<div class="panel soft"><header><h3>${title}</h3><span class="muted small" data-derived="count_${role}"></span></header>
    <div class="chips">${ALL_FAMS.map((code) => `<button type="button" class="chip ${NX.FAMILY_KIND[code] ? '' : 'off'}" data-fam="${role}:${code}" aria-pressed="${f.familias.includes(code)}" title="${NX.FAMILY_KIND[code] ? 'Rama implementada' : esc(NX.OUT_OF_SCOPE_WHY[code] || '')}">${FAM_SHORT[code]}</button>`).join('')}</div>
    <div class="grid3">${num(`candidatos.${role}.dmin`, 'Peralte mín.', 'mm')}${num(`candidatos.${role}.dmax`, 'Peralte máx.', 'mm')}${num(`candidatos.${role}.mmax`, 'Masa máx.', 'kg/m')}</div>
  </div>`;
}
function step6() {
  return `${stepHead('Comparación de perfiles', 'Se recorre cada combinación de viga y columna. Un perfil puede cumplir con unas columnas y fallar con otras, por eso se evalúan marcos completos.')}
  <div class="panel"><header><h2>Candidatos</h2><span class="muted small">Ecs. 94 a 97</span></header>
    <div class="grid2">${candPanel('vigas', 'Vigas')}${candPanel('columnas', 'Columnas')}</div>
    <div class="note">Las familias en gris no tienen rama de comprobación implementada para miembros de marco; si las incluyes aparecerán como «fuera del alcance», nunca como aprobadas o falladas (Guía 9.0).</div>
    <div class="row between">
      <div data-derived="evalCount" class="muted"></div>
      <div class="row">${check('diseno.riguroso', 'Segundo orden en todas las combinaciones', 'Más lento. Por omisión se reanalizan las combinaciones con η ≥ 0.75 η máx. de primer orden.')}</div>
    </div>
    <div class="row"><button class="btn primary" type="button" data-eval>Evaluar alternativas</button><button class="btn" type="button" data-stop hidden>Detener</button></div>
    <div data-derived="evalProgress"></div>
  </div>
  <div data-derived="evalResults"></div>
  ${stepFoot()}`;
}

/* ---------------- 7. Placa base ---------------- */
function step7() {
  const b = S.p.base, a = b.anclas;
  const grade = a.futa === 400 ? 'g36' : a.futa === 517 ? 'g55' : a.futa === 862 ? 'g105' : 'otro';
  return `${stepHead('Placa base y anclas', 'Revisión preliminar con las reacciones simultáneas de cada combinación en las dos bases de la alternativa analizada.')}
  <div class="panel"><header><h2>Columna y reacciones</h2></header><div data-derived="baseCol"></div></div>
  <div class="panel"><header><h2>Concreto y placa</h2></header>
    <div class="grid3">
      ${num('base.fc', "f'c del pedestal", 'MPa')}${num('base.ped.B', 'Pedestal B', 'mm')}${num('base.ped.N', 'Pedestal N', 'mm')}
      ${num('base.ped.h', 'Altura del pedestal', 'mm')}${num('base.placa.B', 'Placa B (ancho)', 'mm')}${num('base.placa.N', 'Placa N (largo)', 'mm')}
      ${num('base.placa.t', 'Espesor de placa', 'mm')}${num('base.placa.Fy', 'Fy de la placa', 'MPa', { hint: 'A36: 250 MPa' })}
    </div>
  </div>
  <div class="panel"><header><h2>Anclas</h2><span class="muted small">ACI 318-19, cap. 17</span></header>
    <div class="grid3">
      <div class="field"><span class="lab">Número de anclas</span>${seg('base.anclas.n', [[4, '4'], [6, '6'], [8, '8']])}</div>
      ${sel('base.anclas.d', 'Diámetro', NX.ANCHOR_SIZES.map(([d, l]) => [d, l]), { t: 'num' })}
      <div class="field"><label for="f_grade">Grado (F1554)</label><div class="inp"><select id="f_grade" data-grade>
        <option value="g36" ${grade === 'g36' ? 'selected' : ''}>Gr. 36 · fya 250, futa 400 MPa</option>
        <option value="g55" ${grade === 'g55' ? 'selected' : ''}>Gr. 55 · fya 380, futa 517 MPa</option>
        <option value="g105" ${grade === 'g105' ? 'selected' : ''}>Gr. 105 · fya 724, futa 862 MPa</option>
        ${grade === 'otro' ? '<option value="otro" selected>Capturado</option>' : ''}</select></div></div>
      ${num('base.anclas.hef', 'Empotramiento hef', 'mm')}${num('base.anclas.sx', 'Separación en B (sx)', 'mm')}${num('base.anclas.sy', 'Separación en N (sy)', 'mm')}
      ${num('base.anclas.borde', 'Distancia a borde ca', 'mm')}
      <div class="field"><span class="lab">Cortante resistido por</span>${seg('base.cortante', [['anclas', 'Anclas'], ['friccion', 'Fricción']])}</div>
      ${S.p.base.cortante === 'friccion' ? num('base.mu', 'Coeficiente de fricción μ', '—') : ''}
    </div>
    ${check('base.anclas.fisurado', 'Concreto fisurado', 'Afecta ψc,N, ψc,P y ψc,V. Sin refuerzo de anclaje (condición B).')}
  </div>
  <div class="panel"><header><h2>Resultados</h2></header><div data-derived="baseRes"></div></div>
  <div class="note warn">Pendientes fuera de esta revisión: soldadura columna–placa, llave de cortante, mortero de nivelación, refuerzo y anclaje del pedestal, y la transferencia a la cimentación (Guía 12.9). Las anclas se revisan siempre con combinaciones LRFD, porque ACI 318 se formula por resistencia.</div>
  ${stepFoot()}`;
}

/* ---------------- enlaces específicos por paso ---------------- */
const STEP_BIND = {
  2: (c) => bindListOps(c),
  3: (c) => {
    bindListOps(c);
    const d = $('#combos', c); if (d) d.addEventListener('toggle', () => { S.openCombos = d.open; });
    $('[data-preset]', c)?.addEventListener('click', () => {
      const k = S.p.diseno.metodo;
      S.p.diseno.combos[k] = JSON.parse(JSON.stringify(NX.PRESET_COMBOS[k]));
      S.p.diseno.combos.SERV = JSON.parse(JSON.stringify(NX.PRESET_COMBOS.SERV));
      touch(true); toast('Combinaciones de referencia restauradas');
    });
    $$('[data-addcombo]', c).forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.addcombo; const list = S.p.diseno.combos[k];
      list.push({ id: k[0] + (list.length + 1) + 'u', nombre: 'Nueva combinación', f: { D: 1.0 } }); touch(true);
    }));
  },
  4: (c) => {
    c.addEventListener('click', (ev) => { const b = ev.target.closest('[data-case]'); if (!b) return; S.loadCase = b.dataset.case; S.view = 'front'; refreshDerived(); drawVisual(); });
  },
  5: (c) => {
    $$('[data-pfam]', c).forEach((s) => s.addEventListener('change', () => {
      const role = s.dataset.pfam, rows = famRows(s.value);
      const pick = rows.find((r) => r.d >= 300) || rows[Math.floor(rows.length / 2)];
      S.p.seleccion[role] = s.value + '|' + pick.des; S.alt = null; renderStep();
    }));
    $$('[data-pdes]', c).forEach((s) => s.addEventListener('change', () => {
      const role = s.dataset.pdes, fam = $(`[data-pfam="${role}"]`, c).value;
      S.p.seleccion[role] = fam + '|' + s.value; S.alt = null; saveCurrent(); refreshDerived(); drawVisual();
    }));
    $('[data-run]', c).addEventListener('click', () => { recompute(); runDetail(); refreshDerived(); drawVisual(); $('#vis-extra').innerHTML = VIS_EXTRA[5](); bindVisExtra(); });
  },
  6: (c) => {
    $$('[data-fam]', c).forEach((b) => b.addEventListener('click', () => {
      const [role, code] = b.dataset.fam.split(':'); const list = S.p.candidatos[role].familias;
      const i = list.indexOf(code); if (i >= 0) list.splice(i, 1); else list.push(code);
      b.setAttribute('aria-pressed', i < 0); saveCurrent(); refreshDerived();
    }));
    $('[data-eval]', c).addEventListener('click', startEval);
    $('[data-stop]', c).addEventListener('click', stopEval);
  },
  7: (c) => {
    $('[data-grade]', c).addEventListener('change', (ev) => {
      const g = { g36: [250, 400], g55: [380, 517], g105: [724, 862] }[ev.target.value];
      if (g) { S.p.base.anclas.fya = g[0]; S.p.base.anclas.futa = g[1]; touch(false, 'base.anclas'); }
    });
  },
};
function bindListOps(c) {
  $$('[data-del]', c).forEach((b) => b.addEventListener('click', () => {
    const path = b.dataset.del, ks = path.split('.'), i = +ks.pop();
    getPath(S.p, ks.join('.')).splice(i, 1); touch(true, path);
  }));
  $$('[data-add]', c).forEach((b) => b.addEventListener('click', () => {
    const t = b.dataset.add;
    if (t === 'capa') S.p.cubierta.capas.push({ nombre: 'Nueva capa', masa: 1.0 });
    if (t === 'equipo') S.p.cargas.equipos.push({ nombre: 'Equipo', masa: 500, x: S.p.estructura.B / 4 });
    if (t === 'extra') S.p.cargas.extra.push({ caso: 'D', miembro: 'rafL', tipo: 'puntual', dir: 'gy', x: 2, P: 5, a: 1, b: 3, qa: 1, qb: 2, M: 5 });
    touch(true, 'cargas');
  }));
}

/* ---------------- panel bajo el dibujo ---------------- */
const VIS_EXTRA = {
  3: () => caseChips(),
  4: () => caseChips(),
  5: () => {
    if (!S.alt || !S.alt.results) return '';
    const r = S.alt.results;
    return `<div class="panel"><div class="row between"><div class="field" style="flex:1;min-width:200px"><label for="f_combo">Combinación</label><div class="inp"><select id="f_combo" data-combo>${r.map((x, i) => `<option value="${i}" ${i === S.comboIdx ? 'selected' : ''}>${esc(x.combo.nombre)}${x.combo.key.includes('·') ? ' · ' + esc(x.combo.key.split('·')[1]) : ''}</option>`).join('')}</select></div></div></div>
      <div class="seg" role="group" aria-label="Diagrama">${[['M', 'Momento'], ['V', 'Cortante'], ['N', 'Axial'], ['D', 'Deformada'], ['R', 'Reacciones']].map(([k, l]) => `<button type="button" data-diag="${k}" aria-pressed="${S.diag === k}">${l}</button>`).join('')}</div></div>`;
  },
  7: () => VIS_EXTRA[5](),
};
function caseChips() {
  if (!S.prep) return '';
  const cs = S.prep.lc.cases;
  return `<div class="panel"><span class="lab small muted">Caso mostrado en el dibujo</span><div class="chips">${cs.map((c) => `<button type="button" class="chip" data-case="${c.id}" aria-pressed="${S.loadCase === c.id}" title="${esc(c.name)}">${c.id}</button>`).join('')}</div></div>`;
}
function bindVisExtra() {
  const x = $('#vis-extra'); if (!x) return;
  $$('[data-case]', x).forEach((b) => b.addEventListener('click', () => { S.loadCase = b.dataset.case; S.view = 'front'; $$('[data-case]', x).forEach((y) => y.setAttribute('aria-pressed', y.dataset.case === S.loadCase)); $$('[data-view]').forEach((v) => v.setAttribute('aria-pressed', v.dataset.view === S.view)); drawVisual(); if (S.step === 4) refreshDerived(); }));
  $('[data-combo]', x)?.addEventListener('change', (ev) => { S.comboIdx = +ev.target.value; S.view = 'front'; drawVisual(); refreshDerived(); });
  $$('[data-diag]', x).forEach((b) => b.addEventListener('click', () => { S.diag = b.dataset.diag; S.view = 'front'; $$('[data-diag]', x).forEach((y) => y.setAttribute('aria-pressed', y.dataset.diag === S.diag)); $$('[data-view]').forEach((v) => v.setAttribute('aria-pressed', v.dataset.view === S.view)); drawVisual(); }));
}
